async function migrateOne(c,isTrash,byId,byName,res){
  const sourcer=c.sourcer;
  if(!S.sourceurs.includes(sourcer)){res.skipped++;return;}
  const ex=byId.get(c.id)||byName.get(normNom(c.nom)+'|'+sourcer);
  const pt=gp(c.posteId)?.titre||c.posteTitre||'';
  if(!ex){
    const sts=S.statuts[sourcer]||DEFAULT_STATUTS;
    const nc={id:c.id,nom:c.nom,trigramme:c.trigramme||'',posteId:'',posteTitre:pt,dispo:c.dispo||'',mobilite:Array.isArray(c.mobilite)?c.mobilite:[],pretention:c.pretention||'',freelance:c.freelance||'Non',remarque:c.remarque||'',sourcer,statut:c.statut||sts[0],ordre:(typeof c.order==='number')?c.order:null,score:c.score||null,verdict:c.verdict||null,telephone:c.telephone||'',analyse:c.analyse||null,createdAt:'',deletedAt:isTrash?(c._trashedAt||new Date().toISOString()):null};
    const o=await localCv(c,'o',c.id,res),a=await localCv(c,'a',c.id,res);
    if(o){nc.cvOUrl=o.url;nc.cvOName=o.name;}
    if(a){nc.cvAUrl=a.url;nc.cvAName=a.name;}
    const{error}=await sb.from('candidats').insert(candToRow(nc));
    if(error)throw error;
    byId.set(nc.id,nc);byName.set(normNom(nc.nom)+'|'+sourcer,nc);
    res.added++;return;
  }
  const upd={};
  if(!ex.cvOUrl){const o=await localCv(c,'o',ex.id,res);if(o){upd.cv_original_url=o.url;upd.cv_original_name=o.name;}}
  if(!ex.cvAUrl){const a=await localCv(c,'a',ex.id,res);if(a){upd.cv_anonyme_url=a.url;upd.cv_anonyme_name=a.name;}}
  if(!ex.analyse&&c.analyse)upd.analyse_cv=c.analyse;
  if(!ex.telephone&&c.telephone)upd.telephone=c.telephone;
  if(!ex.pretention&&c.pretention)upd.pretention=c.pretention;
  if(!ex.dispo&&c.dispo)upd.dispo=c.dispo;
  if(!ex.remarque&&c.remarque)upd.remarque=c.remarque;
  if(!ex.trigramme&&c.trigramme)upd.trigramme=c.trigramme;
  if(!ex.score&&c.score){upd.score=c.score;upd.verdict=c.verdict||null;}
  if(isTrash&&ex.id===c.id&&!ex.deletedAt){upd.deleted_at=c._trashedAt||new Date().toISOString();res.trashed++;}
  if(Object.keys(upd).length){await dbUpd(ex.id,upd);res.patched++;}
}
async function migrateLocal(logFn){
  const L=scanLocal();
  const all=S.candidates.concat(S.trash);
  const byId=new Map(all.map(c=>[c.id,c]));
  const byName=new Map();all.forEach(c=>{const k=normNom(c.nom)+'|'+c.sourcer;if(!byName.has(k))byName.set(k,c);});
  const res={added:0,patched:0,cvs:0,trashed:0,errors:0,skipped:0,statuts:0};
  const items=[...L.cands.map(c=>({c,t:false})),...L.trash.map(c=>({c,t:true}))];
  let i=0;
  for(const{c,t}of items){
    i++;logFn(`${i}/${items.length} — ${c.nom}`);
    try{await migrateOne(c,t,byId,byName,res);}
    catch(e){console.error('migrate',c.nom,e);res.errors++;}
  }
  // statuts personnalisés de ce PC (seulement si la base n'en a pas encore pour ce sourceur)
  try{
    const ls=L.statuts;
    if(ls&&typeof ls==='object'){
      for(const s of S.sourceurs){
        const arr=ls[s];
        if(Array.isArray(arr)&&arr.length&&!S.kanbanKnown.has(s)&&JSON.stringify(arr)!==JSON.stringify(DEFAULT_STATUTS)){
          S.statuts[s]=arr.filter(x=>typeof x==='string'&&x.trim());await saveKanban(s);res.statuts++;
        }
      }
    }
  }catch(e){console.error('migrate statuts',e);res.errors++;}
  return res;
}
function openMigration(){
  window._local=scanLocal();const L=window._local;
  const n=L.cands.length+L.trash.length;
  document.getElementById('mroot').innerHTML=`<div class="overlay" onclick="if(event.target===this&&!window._migRunning)closeM()"><div class="modal" onclick="event.stopPropagation()">
    <div class="m-title">Reprendre les données de cet ordinateur<button class="m-close" onclick="if(!window._migRunning)closeM()">×</button></div>
    <div id="mig-body" style="font-size:13px;line-height:1.7;color:#374151">
      ${n===0?'Rien à reprendre : aucun profil n\'est enregistré uniquement sur ce navigateur.':`Trouvé sur cet ordinateur : <strong>${L.cands.length}</strong> profil(s) et <strong>${L.trash.length}</strong> en corbeille.<br>
      Ils vont être envoyés dans la base commune <strong>avec leurs CVs</strong>. Les profils déjà présents ne sont pas dupliqués : seuls les champs vides (CV, prétention, téléphone…) sont complétés. Rien n'est supprimé de cet ordinateur.`}
    </div>
    <div class="m-actions"><button class="btn" id="mig-close" onclick="closeM()">Fermer</button>${n>0?'<button class="btn btn-p" id="mig-go" onclick="runMigration()">Lancer la reprise</button>':''}</div>
  </div></div>`;
}
async function runMigration(){
  if(window._migRunning)return;window._migRunning=true;
  const body=document.getElementById('mig-body'),go=document.getElementById('mig-go'),cl=document.getElementById('mig-close');
  if(go)go.disabled=true;if(cl)cl.disabled=true;
  body.innerHTML='<div class="spinner" style="display:inline-block;vertical-align:middle;margin-right:8px"></div><span id="mig-log">Préparation…</span>';
  let res;
  try{
    await loadAll();
    res=await migrateLocal(t=>{const el=document.getElementById('mig-log');if(el)el.textContent=t;});
    await loadAll();
  }catch(e){console.error(e);res={errors:1,added:0,patched:0,cvs:0,trashed:0,skipped:0,statuts:0};}
  window._migRunning=false;
  if(!res.errors){try{localStorage.setItem('tn_migrated_v59',String(Date.now()));}catch(e){}}
  body.innerHTML=`<div style="font-size:14px;font-weight:600;color:${res.errors?'#854d0e':'#166534'};margin-bottom:8px">${res.errors?'Terminé avec '+res.errors+' erreur(s)':'✓ Reprise terminée'}</div>
    Profils ajoutés : <strong>${res.added}</strong><br>Profils complétés : <strong>${res.patched}</strong><br>CVs envoyés : <strong>${res.cvs}</strong><br>
    Supprimés (corbeille) : <strong>${res.trashed}</strong><br>${res.statuts?`Statuts repris : <strong>${res.statuts}</strong><br>`:''}${res.skipped?`Ignorés (sourceur inconnu) : ${res.skipped}<br>`:''}
    ${res.errors?'<div style="margin-top:8px;color:#854d0e">Relance la reprise : ce qui est déjà passé ne sera pas dupliqué.</div>':''}`;
  if(cl){cl.disabled=false;}if(go){go.textContent='Relancer';go.disabled=false;}
  renderBanner();
}

// VÉRIFICATION DE LA BASE (script SQL v59 exécuté ?)

async function checkSchema(){
  const a=await sb.from('candidats').select('ordre,deleted_at,cv_original_url,cv_anonyme_url,analyse_cv,tjm').limit(1);
  const b=await sb.from('kanban_config').select('sourcer').limit(1);
  if(!a.error&&!b.error)return true;
  const err=a.error||b.error;console.error('checkSchema',err);
  const offline=!err.code&&/fetch|network|failed/i.test(err.message||'');
  document.getElementById('mroot').innerHTML=`<div style="position:fixed;inset:0;background:#f3f4f6;display:flex;align-items:center;justify-content:center;z-index:400"><div style="background:#fff;border-radius:16px;padding:32px;width:520px;max-width:94vw;box-shadow:0 8px 32px rgba(0,0,0,.12)">
    <div style="font-size:18px;font-weight:700;color:var(--navy);margin-bottom:10px">${offline?'Connexion à la base impossible':'Mise à jour de la base nécessaire (1 seule fois)'}</div>
    <div style="font-size:13px;color:#374151;line-height:1.7">${offline?'Vérifie ta connexion internet puis réessaie.':'Ouvre <strong>Supabase → SQL Editor</strong>, colle le contenu du fichier <strong>tafinar_v59_migration.sql</strong> et clique <strong>Run</strong>. Rien n\'est supprimé. Reviens ensuite ici.'}
    <div style="font-size:11px;color:#9ca3af;margin-top:8px">${esc(err.message||'')}</div></div>
    <div style="margin-top:16px"><button class="btn btn-p" onclick="location.reload()">Réessayer</button></div></div></div>`;
  return false;
}

// ACTUALISATION AUTOMATIQUE (autres PC)
// ═══════════════════════════════════════
let _refreshOn=false;
function setupRefresh(){
  if(_refreshOn)return;_refreshOn=true;
  const maybe=()=>{
    if(document.hidden||_loading||_saving||window._migRunning)return;
    if(document.querySelector('#mroot .overlay,#cv-dl-popup,#poste-check-popup'))return;
    if(S.dragId||S.colDragIdx!==null)return;
    const t=document.activeElement&&document.activeElement.tagName;
    if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT')return;
    if(Date.now()-(S._lastLoad||0)<20000)return;
    loadAll();
  };
  window.addEventListener('focus',maybe);
  document.addEventListener('visibilitychange',maybe);
  setInterval(maybe,60000);
}

async function init(){
  loadLocal();
  const session=getSession();
  if(!session){try{await fetchKanban();}catch(e){}showLogin();return;}
  S.srcr=session.name;
  renderTopbarUser();
  render();
  showLoader(true);
  try{
    if(!(await checkSchema()))return;
    window._local=scanLocal();
    await Promise.all([fetchPostes(),fetchKanban()]);
    await fetchCandidats();
    await fetchSuivi();
    S._lastLoad=Date.now();
    render();
  }catch(e){
    console.error('Supabase init error:',e);
    showToast('Connexion à la base impossible — recharge la page quand le réseau est revenu','warn');
  }finally{
    showLoader(false);
  }
  handleURLParams();
  checkPendingImport();
  checkPendingPoste();
  setupRefresh();
}

function saveDraft(){
  try{
    const mobilite=[...document.querySelectorAll('#mob-tags .tg')].map(el=>el.childNodes[0].textContent.trim());
    const draft={
      nom:document.getElementById('f-nom')?.value||'',
      tri:document.getElementById('f-tri')?.value||'',
      ps:document.getElementById('f-ps')?.value||'',
      pid:document.getElementById('f-pid')?.value||'',
      dis:document.getElementById('f-dis')?.value||'',
      mobilite:mobilite,
      pret:document.getElementById('f-pret')?.value||'',
      free:document.getElementById('f-free')?.value||'Non',
      rem:document.getElementById('f-rem')?.value||'',
      tel:document.getElementById('f-tel')?.value||'',
      tjm:document.getElementById('f-tjm')?.value||'',
      ts:Date.now()
    };
    localStorage.setItem('tn_form_draft',JSON.stringify(draft));
  }catch(e){}
}
function clearDraft(){localStorage.removeItem('tn_form_draft');}
function loadDraft(){
  try{
    const raw=localStorage.getItem('tn_form_draft');
    if(!raw)return false;
    const d=JSON.parse(raw);
    // Only load if draft is less than 2 hours old
    if(!d.ts||Date.now()-d.ts>7200000){clearDraft();return false;}
    return d;
  }catch(e){return false;}
}

// ═══════════════════════════════════════
// PREFILL FROM RECRUTEMENT (postMessage)
// ═══════════════════════════════════════
window.addEventListener('message', function(e){
  // Handle poste prefill from Recrutement
  if(e.data&&e.data.type==='tn_poste'){
    const d=e.data.payload;if(!d)return;
    const tryOpenPoste=function(attempt){
      if(S.postes.length>0||attempt>10){
        if(document.querySelector('#mroot .modal')){showToast('Un formulaire est déjà ouvert — termine-le puis renvoie le poste','warn');return;}
        openPosteForm(null);
        setTimeout(function(){
          const set=function(id,v){const el=document.getElementById(id);if(el&&v!==undefined)el.value=v;};
          set('p-tit',d.titre);
          set('p-cli',d.client||'');
          set('p-desc',d.description||'');
          if(d.titre)chkDupP();
          showToast('Poste pré-rempli depuis Recrutement TAFINAR','ok');
        },100);
      } else {
        setTimeout(function(){tryOpenPoste(attempt+1);},300);
      }
    };
    tryOpenPoste(0);
    return;
  }
  if(!e.data||e.data.type!=='tn_prefill')return;
  const d=e.data.payload;
  if(!d)return;
  pendingAnalyse=d.analyse||null;
  window._pendingScore=d.score?{score:parseInt(d.score)||null,verdict:d.verdict||''}:null;
  // Wait for Supabase data to be ready, then open form
  const tryOpen=function(attempt){
    if(S.postes.length||attempt>10){
      // Don't override a form already open
      if(document.querySelector('#mroot .modal')){showToast('Un formulaire est déjà ouvert — termine-le puis renvoie le profil','warn');return;}
      openForm(null);
      setTimeout(function(){
        const set=function(id,v){const el=document.getElementById(id);if(el&&v)el.value=v;};
        set('f-nom',d.nom);
        set('f-tri',d.trigramme);
        set('f-pret',d.pretention);
        set('f-dis',d.dispo);
        if(d.telephone)set('f-tel',d.telephone);
        const fsrc=document.getElementById('f-src');
        if(fsrc)fsrc.value=getWho();
        if(d.poste){
          set('f-ps',d.poste);
          const match=S.postes.find(p=>sim(p.titre,d.poste)>0.6);
          if(match){const hid=document.getElementById('f-pid');if(hid)hid.value=match.id;}
          else filtPS();
        }
        if(d.score){
          const modal=document.querySelector('.modal');
          if(modal){
            const banner=document.createElement('div');
            banner.style.cssText='background:#f0faf4;border:1px solid #86efac;border-radius:6px;padding:6px 10px;font-size:12px;color:#166534;margin-bottom:10px;display:flex;align-items:center;gap:6px';
            banner.innerHTML='<i class="ti ti-chart-bar" aria-hidden="true"></i> Score depuis Recrutement TAFINAR : <strong>'+d.score+'/100 — '+d.verdict+'</strong>';
            modal.insertBefore(banner,modal.firstChild.nextSibling);
          }
        }
        // Clear draft since we have fresh data
        clearDraft();
      },80);
    } else {
      setTimeout(function(){tryOpen(attempt+1);},300);
    }
  };
  tryOpen(0);
});
