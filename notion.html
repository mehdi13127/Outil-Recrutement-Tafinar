<!DOCTYPE html>
<html lang="fr">
<head>

<title>Notion TAFINAR v60</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">

<style>
:root{--navy:#0d3b6e;--green:#0e7c3a;--red:#a32d2d;--fs:system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fs);font-size:14px;color:#111;background:#eef0f3;min-height:100vh}
.topbar{display:flex;align-items:center;gap:8px;padding:10px 18px;background:#fff;border-bottom:1px solid #e5e7eb;flex-wrap:wrap;position:sticky;top:0;z-index:50}
.logo{font-size:16px;font-weight:600;color:var(--navy);flex:1;white-space:nowrap}
.logo span{font-weight:400;opacity:.6}
.nav{display:flex;gap:4px}
.tab{padding:5px 13px;border:1px solid #e5e7eb;border-radius:8px;cursor:pointer;font-size:13px;background:transparent;color:#6b7280;font-family:var(--fs)}
.tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.tab:hover:not(.active){background:#f9fafb}
.btn{padding:6px 14px;border:1px solid #e5e7eb;border-radius:8px;cursor:pointer;font-size:12px;background:transparent;color:#111;font-family:var(--fs)}
.btn:hover{background:#f9fafb}
.btn-p{background:var(--navy)!important;color:#fff!important;border-color:var(--navy)!important}
.btn-p:hover{background:#0a2f58!important}
.btn-g{background:var(--green)!important;color:#fff!important;border-color:var(--green)!important}
.btn-g:hover{background:#0b6330!important}
.btn-r{color:var(--red)!important;border-color:transparent!important}
.btn-r:hover{background:#fef2f2!important}
.btn-link{padding:5px 12px;background:var(--green);color:#fff;border-radius:8px;font-size:12px;text-decoration:none;display:inline-flex;align-items:center;gap:4px;border:none;cursor:pointer;font-family:var(--fs)}
.btn-link:hover{background:#0b6330}
.content{padding:16px;max-width:1400px;margin:0 auto}
.zone-bar{display:flex;gap:6px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
.zone-btn{padding:5px 14px;border:1px solid #e5e7eb;border-radius:20px;cursor:pointer;font-size:13px;background:transparent;color:#6b7280;font-family:var(--fs)}
.zone-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.kanban{display:flex;gap:10px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.col{min-width:200px;flex:0 0 200px;background:#fff;border-radius:12px;padding:10px;border:1px solid #e5e7eb}
.col-head{display:flex;align-items:center;gap:4px;margin-bottom:8px}
.col-name{font-size:12px;font-weight:500;background:transparent;border:none;color:#111;flex:1;outline:none;min-width:0;font-family:var(--fs)}
.col-name:focus{background:#f3f4f6;border-radius:4px;padding:1px 4px}
.col-cnt{font-size:10px;background:#f3f4f6;border:1px solid #e5e7eb;border-radius:10px;padding:1px 6px;color:#6b7280;white-space:nowrap;flex-shrink:0}
.col-del{background:none;border:none;cursor:pointer;color:#9ca3af;font-size:14px;opacity:.4;flex-shrink:0;padding:0}
.col-del:hover{opacity:1;color:var(--red)}
.col.col-dragging{opacity:.4;border:1px dashed #9ca3af}
.col.col-drag-over{border:2px dashed var(--navy);background:#eff6ff}
.drag-handle{font-size:16px;color:#9ca3af;cursor:grab;padding:0 4px;flex-shrink:0;user-select:none;line-height:1}
.drag-handle:hover{color:#6b7280}
.zone-bar-line{height:6px;border-radius:2px;margin-bottom:14px;transition:background .3s}
.add-col{min-width:140px;flex:0 0 140px;border:1.5px dashed #e5e7eb;border-radius:12px;padding:10px;display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;font-size:12px;color:#9ca3af;background:transparent}
.add-col:hover{background:#f9fafb;border-color:#9ca3af}
.drop-zone{min-height:32px}
.card.readonly{opacity:.85;border-left:3px solid #cbd5e1;cursor:default}
.card.readonly:hover{border-color:#e5e7eb}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:8px 28px 8px 28px;margin-bottom:6px;cursor:pointer;position:relative;transition:border-color .15s}
.card:hover{border-color:var(--navy)}
.card.dragging{opacity:.4}
.card.sel{border-color:var(--green);background:#f0faf4}
.card-check{position:absolute;top:9px;left:8px;width:13px;height:13px;cursor:pointer;accent-color:var(--green)}
.card-name{font-size:12px;font-weight:500}
.card-poste{font-size:11px;color:#6b7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-score{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:1px 6px;border-radius:6px;margin-top:3px}
.score-m{background:#dcfce7;color:#166534}.score-p{background:#fef9c3;color:#854d0e}.score-n{background:#fee2e2;color:#991b1b}
.card-del{position:absolute;top:6px;right:6px;background:none;border:none;cursor:pointer;color:#9ca3af;font-size:13px;opacity:.4;padding:0}
.card-del:hover{opacity:1;color:var(--red)}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;padding-top:24px;z-index:200}
.modal{background:#fff;border-radius:12px;padding:20px;width:560px;max-height:88vh;overflow-y:auto;border:1px solid #e5e7eb;box-shadow:0 8px 32px rgba(0,0,0,.12)}
.m-title{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.m-close{background:none;border:none;cursor:pointer;font-size:20px;color:#9ca3af}
.fr{margin-bottom:10px}
.fl{display:block;font-size:11px;color:#6b7280;margin-bottom:3px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.fi{width:100%;padding:7px 10px;border:1px solid #e5e7eb;border-radius:8px;font-size:13px;background:#fff;color:#111;font-family:var(--fs)}
.fi:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 2px rgba(13,59,110,.08)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;padding-top:12px;border-top:1px solid #e5e7eb;flex-wrap:wrap}
.drop-list{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #e5e7eb;border-radius:8px;z-index:300;max-height:180px;overflow-y:auto;box-shadow:0 4px 16px rgba(0,0,0,.1)}
.drop-list>div{padding:7px 10px;cursor:pointer;font-size:12px}
.drop-list>div:hover{background:#f3f4f6}
.sug-item{padding:7px 10px;cursor:pointer;border-bottom:1px solid #f3f4f6}
.sug-item:hover{background:#f3f4f6}
.sug-t{font-weight:500;font-size:12px}
.sug-m{color:#6b7280;font-size:10px}
.tags-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tg{font-size:11px;padding:2px 8px;background:#f3f4f6;border-radius:10px;display:flex;align-items:center;gap:4px;border:1px solid #e5e7eb}
.tg-x{cursor:pointer;color:#9ca3af;font-size:12px}
.tg-x:hover{color:var(--red)}
.warn-txt{color:var(--red);font-size:11px;margin-top:3px}
.dup-box{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;background:#fef9c3;border-radius:8px;font-size:12px;margin-top:6px}
.cv-sec{border-top:1px solid #f3f4f6;padding-top:10px;margin-top:10px}
.cv-row{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.cv-lbl{font-size:11px;color:#6b7280;width:90px;flex-shrink:0}
.cv-up{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border:1px solid #e5e7eb;border-radius:8px;cursor:pointer;font-size:11px;color:#6b7280;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv-up:hover{background:#f3f4f6}
.cv-up.has{background:#f0faf4;color:#166534;border-color:#86efac}
.bloc-mail{background:#f9fafb;border-radius:8px;padding:12px;font-size:12px;white-space:pre-wrap;font-family:monospace;border:1px solid #e5e7eb;max-height:140px;overflow-y:auto;line-height:1.6}
.mail-preview{background:#f9fafb;border-radius:8px;padding:14px;font-size:12px;white-space:pre-wrap;font-family:monospace;border:1px solid #e5e7eb;max-height:360px;overflow-y:auto;line-height:1.7}
.divider{border:none;border-top:1px solid #f3f4f6;margin:12px 0}
.profils-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.pc{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:10px 10px 10px 28px;cursor:pointer;position:relative;transition:border-color .15s}
.pc:hover{border-color:var(--navy)}
.pc.sel{border-color:var(--green);background:#f0faf4}
.pc-src{font-size:10px;color:#9ca3af;margin-bottom:3px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.pc-name{font-size:13px;font-weight:600}
.pc-poste{font-size:11px;color:#6b7280;margin-bottom:5px}
.ptag{font-size:10px;padding:1px 6px;border-radius:6px;margin-right:3px}
.ptag-b{background:#dbeafe;color:#1e40af}
.ptag-g{background:#dcfce7;color:#166534}
.ptag-n{background:#f3f4f6;color:#6b7280}
.lt{width:100%;border-collapse:collapse;font-size:12px;background:#fff}
.lt th{text-align:left;padding:7px 10px;border-bottom:1px solid #e5e7eb;font-size:11px;color:#6b7280;font-weight:600;text-transform:uppercase;letter-spacing:.04em;background:#f9fafb}
.lt td{padding:7px 10px;border-bottom:1px solid #f3f4f6}
.lt tr.sel td{background:#f0faf4}
.lt tr:hover td{background:#f9fafb}
.tvw{display:flex;border:1px solid #e5e7eb;border-radius:8px;overflow:hidden}
.tvw button{padding:5px 12px;background:transparent;border:none;cursor:pointer;font-size:12px;color:#6b7280;font-family:var(--fs)}
.tvw button.active{background:var(--navy);color:#fff}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.pc2{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:12px;cursor:pointer;transition:border-color .15s}
.pc2:hover{border-color:var(--navy)}
.u-r{color:var(--red)}.u-n{font-weight:600}.u-j{color:#854d0e}
.tb{display:flex;gap:8px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
.par-sec{margin-bottom:22px;background:#fff;border-radius:12px;padding:16px;border:1px solid #e5e7eb}
.par-sec h3{font-size:13px;font-weight:600;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:6px}
.par-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #f3f4f6}
.par-item:last-child{border-bottom:none}
.toast{position:fixed;bottom:20px;right:20px;background:#111;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:500;transition:opacity .3s;max-width:320px}
.toast.hide{opacity:0;pointer-events:none}
.toast.warn{background:#854d0e}
.toast.ok{background:#166534}
.loader-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;z-index:100;font-size:13px;color:#6b7280;gap:10px}
.spinner{width:20px;height:20px;border:2px solid #e5e7eb;border-top-color:var(--navy);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.badge-mail{background:var(--red);color:#fff;font-size:10px;padding:1px 5px;border-radius:8px;margin-left:4px;font-weight:600}
.analyse-sec{border-top:1px solid #f3f4f6;padding-top:10px;margin-top:10px}
.analyse-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
.analyse-table th{text-align:left;padding:5px 7px;border-bottom:1px solid #e5e7eb;font-size:10px;color:#6b7280;font-weight:600;background:#f9fafb}
.analyse-table td{padding:5px 7px;border-bottom:1px solid #f3f4f6;vertical-align:top}
.analyse-table td:first-child{font-weight:500;color:#111}
.verdict-analyse{background:#f9fafb;border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.7;margin-top:8px;border:1px solid #e5e7eb}
.verdict-analyse p{margin-bottom:4px}
.score-m{background:#dcfce7;color:#166534}.score-p{background:#fef9c3;color:#854d0e}.score-n{background:#fee2e2;color:#991b1b}
.info-banner{background:#dbeafe;border:1px solid #bfdbfe;border-radius:8px;padding:10px 14px;font-size:12px;color:#1e40af;margin-bottom:14px;display:flex;align-items:center;gap:8px}
</style>
</head>
<body>


<div id="loader" class="loader-overlay" style="display:none">
  <div class="spinner"></div> Chargement des données...
</div>

<div class="topbar">
  <span class="logo">Notion <span>TAFINAR</span></span><span style="font-size:10px;color:#9ca3af;margin-left:6px">v60</span>
  <div id="topbar-user" style="display:flex;align-items:center;gap:8px;font-size:12px"></div>
  <button id="mail-btn" class="btn" onclick="openMailModal()" style="opacity:.4;pointer-events:none;border-color:var(--green);color:var(--green);font-size:12px">
    <i class="ti ti-mail" aria-hidden="true"></i> Mail récap
  </button>
  <div class="nav">
    <button class="tab active" onclick="showTab('s')">Sourceurs</button>
    <button class="tab" onclick="showTab('p')">Les Profils</button>
    <button class="tab" onclick="showTab('po')">Postes</button>
    <button class="tab" onclick="showTab('su')">Suivi</button>
    <button class="tab" onclick="showTab('cfg')">Paramètres</button>
    <button class="tab" onclick="showTab('trash')" id="tab-trash-btn">🗑 Corbeille <span id="trash-count" style="background:#dc2626;color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;display:none">0</span></button>
  </div>
  <button class="btn-link" onclick="window.parent.switchTo('rec')"><i class="ti ti-arrows-exchange" aria-hidden="true"></i> Recrutement TAFINAR</button>
</div>

<div id="banner"></div>
<div class="content" id="main"></div>
<div id="mroot"></div>
<div id="toast" class="toast hide"></div>

<script>
// ═══════════════════════════════════════
// SUPABASE
// ═══════════════════════════════════════
const SB_URL = 'https://lqqgweqsscyfrqosbcah.supabase.co';
const SB_KEY = 'sb_publishable_HpXipfY__RmCKOqeGZZMHQ_wJ83l2Yi';
const sb = window.supabase.createClient(SB_URL, SB_KEY);

// ═══════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════
const VILLES = ["Paris","Lyon","Marseille","Toulouse","Nice","Nantes","Strasbourg","Montpellier","Bordeaux","Lille","Rennes","Reims","Saint-Étienne","Toulon","Le Havre","Grenoble","Dijon","Angers","Nîmes","Brest","Tours","Amiens","Limoges","Perpignan","Metz","Besançon","Orléans","Rouen","Caen","Nancy","Mulhouse","Avignon","Pau","Versailles","Poitiers","Courbevoie","Boulogne-Billancourt","Bourges","La Rochelle","Calais","Antibes","Cannes","Issy-les-Moulineaux","Saint-Nazaire","Levallois-Perret","Quimper","Troyes","Valence","Évreux","Blois","Chartres","Cergy","Marignane","Vitrolles","Aubagne","Istres","Fos-sur-Mer","Salon-de-Provence","Arles","Béziers","Sète","Montauban","Albi","Tarbes","Thionville","Saint-Dizier","Belfort","Montbéliard","Chalon-sur-Saône","Annecy","Chambéry","Fréjus","Draguignan","Hyères","La Ciotat","Martigues","Saint-Raphaël","Menton","Grasse","Sophia Antipolis","Lorient","Vannes","Saint-Brieuc","Lannion","Cherbourg","Bayeux","Deauville","La Roche-sur-Yon","Niort","Angoulême","Saintes","Rochefort","Royan","Libourne","Périgueux","Bergerac","Agen","Mont-de-Marsan","Dax","Bayonne","Biarritz","Anglet","Rueil-Malmaison","Nanterre","Vitry-sur-Seine","Créteil","Dunkerque","Colombes","Tourcoing","Roubaix","Valenciennes","Aubervilliers","Aulnay-sous-Bois","Asnières-sur-Seine","Fontenay-sous-Bois","Noisy-le-Grand","Sartrouville","France entière","Île-de-France","PACA","Occitanie","Bretagne","Grand Est","Normandie","Hauts-de-France","Remote","Full remote"];
const DISPOS = ["Immédiatement","1 mois","2 mois","3 mois"];
const DEFAULT_STATUTS = ['🆕 Nouveau','📤 À appeler','✅ À envoyer','⏳ En attente','📦 Archiver'];
// ═══════════════════════════════════════
// STATE  (v59 : Supabase = seule source de vérité)
// ═══════════════════════════════════════
let eCV = {o:null, a:null};        // CV affichés dans le formulaire {name,url}
let eCVFiles = {o:null, a:null};   // nouveaux fichiers choisis (pas encore envoyés)
let pendingAnalyse = null;
let S = {
  tab: 's',
  srcr: 'Mehdi',
  sourceurs: ['Mehdi','Said','Amine'],
  statuts: {Mehdi:[...DEFAULT_STATUTS],Said:[...DEFAULT_STATUTS],Amine:[...DEFAULT_STATUTS]},
  kanbanKnown: new Set(),  // sourceurs présents dans kanban_config
  candidates: [],   // Supabase — tous les profils actifs
  trash: [],        // Supabase — profils supprimés (deleted_at)
  postes: [],       // Supabase
  sel: new Set(),   // ids sélectionnés pour le mail
  remHist: [],
  dragId: null,
  colDragIdx: null,
  pView: 'list',
  profilSort: 'nom',
  posteView: 'grid',
  posteSort: 'date',
};

// ═══════════════════════════════════════
// UTILS
// ═══════════════════════════════════════
function uid(){return 'x'+Math.random().toString(36).substr(2,9)+Date.now().toString(36).slice(-3)}
function isUUID(s){return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(s||'')}
function sim(a,b){a=(a||'').toLowerCase().trim();b=(b||'').toLowerCase().trim();if(a===b)return 1;if(!a||!b)return 0;if(a.includes(b)||b.includes(a))return.85;const sa=new Set(a.split(/\s+/));const sb2=new Set(b.split(/\s+/));return[...sa].filter(x=>sb2.has(x)).length/new Set([...sa,...sb2]).size;}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function tryJSON(s,d){if(s===null||s===undefined)return d;if(typeof s!=='string')return s;try{const r=JSON.parse(s);return(r===null||r===undefined)?d:r;}catch{return d;}}
function gp(id){return S.postes.find(p=>p.id===id);}
function normNom(s){return (s||'').toLowerCase().replace(/\s+/g,' ').trim();}

let toastTimer;
function showToast(msg,type='ok'){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className='toast '+(type||'ok');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{el.className='toast hide';},type==='warn'?7000:3500);
}
function showLoader(v){document.getElementById('loader').style.display=v?'flex':'none';}
function updateMailBtn(){
  const btn=document.getElementById('mail-btn');if(!btn)return;
  const n=S.sel.size;
  btn.innerHTML=`<i class="ti ti-mail" aria-hidden="true"></i> Mail récap${n>0?` <strong>(${n})</strong>`:''}`;
  btn.style.opacity=n>0?'1':'.4';
  btn.style.pointerEvents=n>0?'auto':'none';
}

// ═══════════════════════════════════════
// LOCAL STORAGE — uniquement des préférences (rien de métier)
// ═══════════════════════════════════════
function saveLocal(){try{localStorage.setItem('tn_remhist',JSON.stringify(S.remHist));}catch(e){}}
function loadLocal(){
  try{const rh=localStorage.getItem('tn_remhist');if(rh)S.remHist=tryJSON(rh,[]);}catch(e){}
}
let pendingCandidatState = null;


// ── Render analysis block (from Recrutement TAFINAR) ──
function renderAnalyse(analyse){
  if(!analyse||!analyse.criteres?.length)return'';
  const iconMap={ok:'✅',partial:'⚠️',partiel:'⚠️',ko:'❌',non:'❌',na:'⬜',no:'❌'};
  const poidsMap={essentiel:'Essentiel',important:'Important',secondaire:'Secondaire'};
  const rows=analyse.criteres.map(c=>`<tr>
    <td class="crit-analyse">${esc(c.nom||'')}</td>
    <td style="text-align:center;color:#6b7280;font-size:10px">${poidsMap[c.poids]||c.poids||''}</td>
    <td style="text-align:center;font-size:14px">${iconMap[c.statut]||'⬜'}</td>
    <td style="color:#6b7280;font-size:10px">${esc(c.commentaire||'')}</td>
  </tr>`).join('');
  const verdict=(analyse.verdictPhrases||[]).map(p=>`<p>${esc(p)}</p>`).join('');
  const dateInfo=analyse.date?`<span style="font-size:10px;color:#9ca3af;margin-left:8px">Analysé le ${esc(analyse.date)}</span>`:'';
  const scoreClass=analyse.score>=75?'score-m':analyse.score>=50?'score-p':'score-n';
  return`<div class="analyse-sec">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">

// CSV PARSER (handles quoted fields)
// ═══════════════════════════════════════
function parseCSV(text){
  // Remove BOM
  text=text.replace(/^\uFEFF/,'');
  const rows=[];let cur=[];let field='';let inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];const n=text[i+1];
    if(inQ){
      if(c==='"'&&n==='"'){field+='"';i++;}
      else if(c==='"'){inQ=false;}
      else{field+=c;}
    }else{
      if(c==='"'){inQ=true;}
      else if(c===','){cur.push(field);field='';}
      else if(c==='\n'){cur.push(field);field='';if(cur.some(f=>f.trim()))rows.push(cur);cur=[];}
      else if(c!=='\r'){field+=c;}
    }
  }
  if(field)cur.push(field);if(cur.some(f=>f.trim()))rows.push(cur);
  return rows;
}

const CV_BUCKET='tafinar-cvs';

// Lecture paginée (Supabase limite à 1000 lignes par requête)
async function fetchAllRows(table,orderCol){
  let all=[];const step=1000;
  for(let from=0;;from+=step){
    const{data,error}=await sb.from(table).select('*').order(orderCol,{ascending:false}).order('id',{ascending:false}).range(from,from+step-1);
    if(error)throw error;
    all=all.concat(data||[]);
    if(!data||data.length<step)break;
  }
  return all;
}

function resolvePostes(){
  S.candidates.concat(S.trash).forEach(c=>{
    c.posteId='';
    if(!c.posteTitre)return;
    let p=S.postes.find(p=>normNom(p.titre)===normNom(c.posteTitre));
    if(!p)p=S.postes.find(p=>sim(p.titre,c.posteTitre)>0.55);
    if(p)c.posteId=p.id;
  });
}

async function fetchCandidats(){
  const all=await fetchAllRows('candidats','created_at');
  const cands=all.filter(r=>r.local_id).map(rowToCand);
  S.candidates=cands.filter(c=>!c.deletedAt);
  S.trash=cands.filter(c=>c.deletedAt).sort((a,b)=>String(b.deletedAt).localeCompare(String(a.deletedAt)));
  // les sélections qui n'existent plus sont retirées
  const ids=new Set(S.candidates.map(c=>c.id));
  [...S.sel].forEach(k=>{if(!ids.has(k))S.sel.delete(k);});
  resolvePostes();
}

async function fetchKanban(){
  const{data,error}=await sb.from('kanban_config').select('*').order('position',{ascending:true});
  if(error)throw error;
  const rows=data||[];
  S.kanbanKnown=new Set(rows.map(r=>r.sourcer));
  const names=rows.map(r=>r.sourcer);
  ['Mehdi','Said','Amine'].forEach(n=>{if(!names.includes(n))names.push(n);});
  S.sourceurs=names;
  const st={};
  names.forEach(n=>{
    const row=rows.find(r=>r.sourcer===n);
    const arr=row?tryJSON(row.statuts,[]):[];
    st[n]=(Array.isArray(arr)&&arr.length)?arr:[...DEFAULT_STATUTS];
  });
  S.statuts=st;
  if(!S.sourceurs.includes(S.srcr))S.srcr=S.sourceurs.includes(getMe())?getMe():S.sourceurs[0];
}

async function pushPoste(p){
  const payload={
    titre:p.titre,client:p.client,
    lieux:JSON.stringify(p.lieux||[]),
    secteur:p.secteur,urgence:p.urgence,statut:p.statut,
    salaire:p.salaire,experience:p.experience,
    nb_candidats:p.nbCandidats,competences:p.competences,
    description:p.description||'',
  };
  if(isUUID(p.id)){
    const{error}=await sb.from('postes').update(payload).eq('id',p.id);
    if(error)throw error;
  }else{
    const{data,error}=await sb.from('postes').insert(payload).select().single();
    if(error)throw error;
    const idx=S.postes.findIndex(x=>x.id===p.id);
    p.id=data.id;p.created_at=data.created_at||null;
    if(idx>=0)S.postes[idx].id=data.id;
  }
}
async function deletePosteDB(id){
  if(isUUID(id)){
    const{error}=await sb.from('postes').delete().eq('id',id);
    if(error)throw error;
  }
  S.postes=S.postes.filter(p=>p.id!==id);
}

async function uploadCvFile(candId,type,file){
  const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  const path=`${candId}/${type}_${Date.now()}_${safe}`;
  const{error}=await sb.storage.from(CV_BUCKET).upload(path,file,{upsert:true,cacheControl:'3600',contentType:file.type||'application/octet-stream'});
  if(error)throw error;
  const{data:{publicUrl}}=sb.storage.from(CV_BUCKET).getPublicUrl(path);
  return{url:publicUrl,name:file.name};
}
function cvPathFromUrl(u){
  const k='/'+CV_BUCKET+'/';const i=(u||'').indexOf(k);
  return i<0?null:decodeURIComponent(u.slice(i+k.length).split('?')[0]);
}
async function removeCvFiles(urls){
  const paths=urls.map(cvPathFromUrl).filter(Boolean);
  if(paths.length)try{await sb.storage.from(CV_BUCKET).remove(paths);}catch(e){console.warn('remove cv',e);}
}

// ── Ordre des cartes ──
function cmpCard(a,b){
  const oa=a.ordre===null?1e9:a.ordre,ob=b.ordre===null?1e9:b.ordre;
  if(oa!==ob)return oa-ob;
  const ca=String(a.createdAt||''),cb=String(b.createdAt||'');
  if(ca!==cb)return ca<cb?-1:1;
  return a.id<b.id?-1:1;
}
function colIdxOf(c){const sts=S.statuts[c.sourcer]||[];const i=sts.indexOf(c.statut);return i<0?0:i;} // statut inconnu → 1ère colonne
function colCards(src,idx){
  return S.candidates.filter(c=>c.sourcer===src&&colIdxOf(c)===idx).sort(cmpCard);
}

function toggleSel(id,e){if(e)e.stopPropagation();if(S.sel.has(id))S.sel.delete(id);else S.sel.add(id);render();}
function toggleSelAll(cb,ids){ids.forEach(id=>{if(cb.checked)S.sel.add(id);else S.sel.delete(id);});render();}

function getSelData(){
  const result=[];
  S.sel.forEach(id=>{
    const c=S.candidates.find(x=>x.id===id);
    if(c){const p=gp(c.posteId);result.push({nom:c.nom,trigramme:c.trigramme,posteTitre:p?p.titre:(c.posteTitre||''),dispo:c.dispo,mobilite:c.mobilite,pretention:c.pretention,tjm:c.tjm,freelance:c.freelance,remarque:c.remarque,score:c.score,verdict:c.verdict,_id:c.id,cvOUrl:c.cvOUrl,cvOName:c.cvOName,cvAUrl:c.cvAUrl,cvAName:c.cvAName});}
  });
  return result;
}

function getMailData(){
  const sel=getSelData();
  const byPoste={};const ordre=[];
  sel.forEach(c=>{const k=c.posteTitre||'Poste non défini';if(!byPoste[k]){byPoste[k]=[];ordre.push(k);}byPoste[k].push(c);});
  return{sel,byPoste,ordre};
}

// ── MAIL RÉCAP : un tableau par poste, colonnes au choix, cellules modifiables ──
const MAIL_COLS=[
  {id:'quad',label:'Profil',visible:true,bold:true},
  {id:'nom',label:'Nom / Prénom',visible:false,bold:true},
  {id:'poste',label:'Poste',visible:true},
  {id:'dispo',label:'Disponibilité',visible:true},
  {id:'mobilite',label:'Mobilité',visible:true},
  {id:'pretention',label:'Prétention',visible:true},
  {id:'tjm',label:'TJM (€ HT)',visible:true},
  {id:'freelance',label:'Freelance',visible:true},
  {id:'remarques',label:'Remarques',visible:true},
];
let mailLignes=[];
let mailTxt={intro:'Bonjour,',intro2:'Veuillez trouver ci-dessous une sélection de profils :',outro:'Nous restons disponibles pour tout renseignement complémentaire.'};

function quadDe(nom){
  nom=(nom||'').trim();if(!nom)return'';
  const w=nom.split(/\s+/).filter(Boolean);
  if(w.length>=2){const a=w[0],b=w[w.length-1];return((a[0]||'')+(a[a.length-1]||'')+(b[0]||'')+(b[b.length-1]||'')).toUpperCase();}
  const x=w[0];return((x[0]||'')+(x[1]||'')+(x[x.length-2]||'')+(x[x.length-1]||'')).toUpperCase();
}

function openMailModal(){
  if(!S.sel.size)return;
  const{sel,ordre,byPoste}=getMailData();
  mailLignes=[];
  ordre.forEach(p=>byPoste[p].forEach(c=>mailLignes.push({
    id:c._id,quad:c.trigramme||quadDe(c.nom),nom:c.nom,poste:p,dispo:c.dispo||'',
    mobilite:(c.mobilite||[]).join(', '),pretention:c.pretention||'',tjm:c.tjm||'',freelance:c.freelance||'',remarques:c.remarque||''
  })));
  document.getElementById('mroot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeM()">
  <div class="modal" style="width:960px;max-width:96vw" onclick="event.stopPropagation()">
    <div class="m-title"><span><i class="ti ti-mail" aria-hidden="true"></i> Mail récap — ${mailLignes.length} profil(s)</span><button class="m-close" onclick="closeM()">×</button></div>
    <div style="font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px">Colonnes affichées</div>
    <div id="mail-cols" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px"></div>
    <div style="font-size:11px;color:#6b7280;margin-bottom:10px">Clique sur un texte ou une cellule pour le modifier avant de copier (le profil n'est pas modifié). Le nom est masqué par défaut : documents client = quadrigramme.</div>
    <div id="mail-dups"></div>
    <div id="mail-prev" style="background:#fafafa;border:1px solid #e5e7eb;border-radius:8px;padding:16px;max-height:55vh;overflow:auto"></div>
    <div class="m-actions">
      <button class="btn btn-r" onclick="S.sel=new Set();closeM()">Vider sélection</button>
      <button class="btn" onclick="closeM()">Fermer</button>
      <button class="btn btn-p" onclick="dlTousCVs()"><i class="ti ti-download" aria-hidden="true"></i> Télécharger les CVs</button>
      <button class="btn btn-g" id="mail-copy-btn" onclick="copyMailFormatted()"><i class="ti ti-copy" aria-hidden="true"></i> Copier → Outlook</button>
    </div>
  </div></div>`;
  mailToggles();mailRender();suMailDups();
}
function mailToggles(){
  const z=document.getElementById('mail-cols');z.innerHTML='';
  MAIL_COLS.forEach(c=>{
    const b=document.createElement('button');
    const paint=()=>{b.className='btn'+(c.visible?' btn-p':'');};
    b.textContent=c.label;paint();
    b.onclick=()=>{c.visible=!c.visible;paint();mailRender();};
    z.appendChild(b);
  });
}
function mailBuildHTML(editable){
  const cols=MAIL_COLS.filter(c=>c.visible);
  const M='#0d3b6e',G='#f0f4f8',W='#ffffff',T='#1a1a1a';
  const FF='font-family:Arial,sans-serif;';
  const groupes={};const ordre=[];
  mailLignes.forEach((l,i)=>{if(!groupes[l.poste]){groupes[l.poste]=[];ordre.push(l.poste);}groupes[l.poste].push(i);});
  // Outlook (moteur Word) perd souvent les couleurs CSS : on double chaque couleur avec bgcolor + <font color>
  const cell=(html,bg,color,bold,extra,attrs)=>{
    let inner=html;
    if(!editable){inner='<font color="'+color+'" face="Arial">'+(bold?'<b>'+html+'</b>':html)+'</font>';}
    return '<td bgcolor="'+bg+'"'+(attrs||'')+' style="background-color:'+bg+';color:'+color+';'+FF+'font-size:12px;'+(bold?'font-weight:700;':'')+(extra||'')+'">'+inner+'</td>';
  };
  const ce=editable?' contenteditable="true"':'';
  let tables='';
  ordre.forEach(poste=>{
    let tb='';
    groupes[poste].forEach((i,k)=>{
      const l=mailLignes[i];const bg=k%2?G:W;
      tb+='<tr bgcolor="'+bg+'">'+cols.map(c=>cell(esc(l[c.id]),bg,c.bold?M:T,c.bold,'padding:8px 12px;border:1px solid #d1d5db;vertical-align:top;',ce+' data-row="'+i+'" data-col="'+c.id+'"')).join('')+'</tr>';
    });
    tables+='<table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="'+W+'" style="border-collapse:collapse;'+FF+'font-size:12px;margin-bottom:24px;"><thead>'
      +'<tr bgcolor="'+M+'">'+cell(esc(poste),M,W,true,'padding:8px 14px;font-size:13px;',' colspan="'+cols.length+'"')+'</tr>'
      +'<tr bgcolor="'+M+'">'+cols.map(c=>cell(esc(c.label),M,W,true,'padding:9px 12px;text-align:left;border:1px solid '+M+';white-space:nowrap;')).join('')+'</tr></thead><tbody>'+tb+'</tbody></table><p style="margin:0;line-height:12px">&nbsp;</p>';
  });
  const para=(k,mt,mb)=>'<p'+ce+' data-txt="'+k+'" style="margin:'+mt+'px 0 '+mb+'px;'+FF+'font-size:13px;color:'+T+';">'+(editable?'':'<font color="'+T+'" face="Arial">')+esc(mailTxt[k])+(editable?'':'</font>')+'</p>';
  return '<div style="'+FF+'font-size:13px;color:'+T+';max-width:750px;">'+para('intro',0,14)+para('intro2',0,20)+tables+para('outro',8,0)+'</div>';
}
function mailRender(){
  const el=document.getElementById('mail-prev');if(!el)return;
  el.innerHTML=mailBuildHTML(true);
  el.querySelectorAll('td[data-col]').forEach(td=>td.addEventListener('input',function(){
    const l=mailLignes[parseInt(this.dataset.row)];if(l)l[this.dataset.col]=this.innerText.trim();
  }));
  el.querySelectorAll('p[data-txt]').forEach(p=>p.addEventListener('input',function(){mailTxt[this.dataset.txt]=this.innerText.trim();}));
}
async function copyMailFormatted(){
  const btn=document.getElementById('mail-copy-btn');
  const html=mailBuildHTML(false);
  let ok=false;
  try{
    if(navigator.clipboard&&window.ClipboardItem){
      const t=document.createElement('div');t.innerHTML=html;
      await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([t.innerText],{type:'text/plain'})})]);
      ok=true;
    }
  }catch(e){ok=false;}
  if(!ok){
    const tmp=document.createElement('div');tmp.style.cssText='position:fixed;top:-9999px;left:-9999px';tmp.innerHTML=html;document.body.appendChild(tmp);
    const r=document.createRange();r.selectNodeContents(tmp);const s=window.getSelection();s.removeAllRanges();s.addRange(r);
    try{ok=document.execCommand('copy');}catch(e){ok=false;}
    s.removeAllRanges();tmp.remove();
  }
  showToast(ok?'Copié — colle dans Outlook':'Copie impossible : sélectionne le tableau et Ctrl+C',ok?'ok':'warn');
  if(ok)suAfterCopy();
}

// ── Téléchargement des CVs (depuis la base) ──
async function dlRemote(url,name,btn){
  try{
    if(btn){btn.disabled=true;btn.textContent='…';}
    const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);
    const b=await r.blob();
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name||'CV.pdf';
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    if(btn){btn.textContent='✓ Téléchargé';btn.disabled=false;}
  }catch(e){
    console.warn('dlRemote',e);window.open(url,'_blank');
    if(btn){btn.textContent='Télécharger';btn.disabled=false;}
  }
}
function cvList(){
  const out=[];
  getSelData().forEach(c=>{
    if(c.cvOUrl)out.push({nom:c.nom||c.trigramme||'?',label:'CV original',url:c.cvOUrl,name:c.cvOName||'CV_original.pdf'});
    if(c.cvAUrl)out.push({nom:c.nom||c.trigramme||'?',label:'CV anonymisé',url:c.cvAUrl,name:c.cvAName||'CV_anonyme.pdf'});
  });
  return out;
}
function dlTousCVs(){

  if(!list.length){showToast('Aucun CV joint pour ces profils','warn');return;}

  const popup=document.createElement('div');
  popup.id='cv-dl-popup';
  popup.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10001;display:flex;align-items:center;justify-content:center';
  const rows=list.map((cv,i)=>`<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #e5e7eb">
      <div><div style="font-weight:600;font-size:13px;color:#111">${esc(cv.nom)}</div>
      <div style="font-size:11px;color:#6b7280">${cv.label} — <span style="color:#9ca3af">${esc(cv.name)}</span></div></div>
      <div style="display:flex;gap:6px;flex-shrink:0">
        <a href="${esc(cv.url)}" target="_blank" class="btn" style="text-decoration:none;font-size:12px">Ouvrir</a>

async function dlAllSeq(btn){

function buildPSDrop(matches){
  const drop=document.getElementById('ps-drop');const warn=document.getElementById('ps-warn');
  if(!drop)return;
  if(!matches.length){
    drop.style.display='none';
    if(warn){warn.textContent='Aucun poste trouvé.';warn.style.display='block';}
    return;
  }
  if(warn)warn.style.display='none';
  drop.innerHTML=matches.map(p=>`<div class="sug-item" onmousedown="event.preventDefault()" onclick="selPoste('${p.id}','${p.titre.replace(/'/g,"\\'").replace(/"/g,'&quot;')}')"><div class="sug-t">${esc(p.titre)}</div><div class="sug-m">${esc(p.client||'')} ${(p.lieux||[]).join(', ')}</div></div>`).join('');
  drop.style.display='block';
}
function filtPSAll(){
  // Show all postes on focus (most recent first)
  const src=[...S.postes];
  if(!src.length)return;
  buildPSDrop(src.slice(0,10));
}
function filtPS(){
  const val=(document.getElementById('f-ps')?.value||'').trim();
  const drop=document.getElementById('ps-drop');const warn=document.getElementById('ps-warn');
  if(!val){
    // Clear hidden posteId when field is emptied — prevents ghost selection
    const hid=document.getElementById('f-pid');if(hid)hid.value='';
    if(drop)drop.style.display='none';
    if(warn)warn.style.display='none';
    return;
  }
  const matches=[...S.postes].filter(p=>p.titre.toLowerCase().includes(val.toLowerCase())||sim(p.titre,val)>0.3).slice(0,8);
  buildPSDrop(matches);
}
function selPoste(id,titre){const inp=document.getElementById('f-ps');if(inp)inp.value=titre;const hid=document.getElementById('f-pid');if(hid)hid.value=id;const drop=document.getElementById('ps-drop');if(drop)drop.style.display='none';const warn=document.getElementById('ps-warn');if(warn)warn.style.display='none';}
function filtDis(){const val=(document.getElementById('f-dis')?.value||'').toLowerCase();const drop=document.getElementById('dis-drop');if(!drop)return;const m=val?DISPOS.filter(d=>d.toLowerCase().includes(val)):DISPOS;drop.innerHTML=m.map(d=>`<div onmousedown="event.preventDefault()" onclick="selDis('${d}')">${d}</div>`).join('')+`<div onmousedown="event.preventDefault()" onclick="selDisFree()" style="font-style:italic;color:#9ca3af;border-top:1px solid #f3f4f6">Saisie libre...</div>`;drop.style.display='block';}

function selDisFree(){const d=document.getElementById('dis-drop');if(d)d.style.display='none';const inp=document.getElementById('f-dis');if(inp){inp.focus();}}
function filtCity(){const val=(document.getElementById('f-city')?.value||'').toLowerCase().trim();const drop=document.getElementById('city-drop');if(!drop||!val){if(drop)drop.style.display='none';return;}const m=VILLES.filter(v=>v.toLowerCase().startsWith(val)).slice(0,6);if(!m.length){drop.style.display='none';return;}drop.innerHTML=m.map(v=>`<div onmousedown="event.preventDefault()" onclick="addCity('${v}')">${v}</div>`).join('');drop.style.display='block';}
function addCity(v){const cont=document.getElementById('mob-tags');const inp=document.getElementById('f-city');const drop=document.getElementById('city-drop');if(cont){const ex=[...cont.querySelectorAll('.tg')].map(el=>el.childNodes[0].textContent.trim());if(!ex.includes(v)){const tg=document.createElement('div');tg.className='tg';tg.innerHTML=`${esc(v)}<span class="tg-x" onclick="this.parentElement.remove()">×</span>`;cont.appendChild(tg);}}if(inp)inp.value='';if(drop)drop.style.display='none';}

function fCvUp(type,input){

function fCvDl(type){

function popupChoice(html,buttons){
  return new Promise(resolve=>{
    const existing=document.getElementById('poste-check-popup');if(existing)existing.remove();
    const popup=document.createElement('div');
    popup.id='poste-check-popup';
    popup.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10000;display:flex;align-items:center;justify-content:center';
    popup.innerHTML=`<div style="background:#fff;border-radius:12px;padding:24px;width:480px;max-width:95vw;box-shadow:0 8px 32px rgba(0,0,0,.2)">${html}<div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px">${buttons.map((b,i)=>`<button data-i="${i}" style="${b.style}">${b.label}</button>`).join('')}</div></div>`;

const BTN_GREY='padding:8px 16px;border:1.5px solid #e5e7eb;border-radius:8px;background:#fff;font-size:13px;cursor:pointer;font-family:inherit;color:#374151';
const BTN_NAVY='padding:8px 16px;background:#0d3b6e;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit';
const BTN_GREEN='padding:8px 16px;background:#0e7c3a;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit';

let _saving=false;
async function saveC(id){
  if(_saving)return;
  const nom=(document.getElementById('f-nom')?.value||'').trim();
  const posteId=document.getElementById('f-pid')?.value||'';
  const posteSaisi=(document.getElementById('f-ps')?.value||'').trim();
  if(!nom){
    const el=document.getElementById('f-nom');
    if(el){el.style.border='1.5px solid #dc2626';el.focus();setTimeout(()=>{if(el)el.style.border='';},2000);}
    showToast('Le nom du candidat est obligatoire','warn');return;
  }
  // ── Poste non sélectionné dans la liste ──
  if(!posteId){
    if(!posteSaisi){
      showToast('Veuillez indiquer un poste','warn');
      const el=document.getElementById('f-ps');if(el){el.style.border='1.5px solid #dc2626';el.focus();setTimeout(()=>{if(el)el.style.border='';},2000);}
      return;
    }
    const similar=S.postes.filter(p=>sim(p.titre,posteSaisi)>0.6);
    let action;
    if(similar.length){
      action=await popupChoice(`<div style="font-size:15px;font-weight:700;color:#111;margin-bottom:6px">🔍 Poste similaire trouvé</div>
        <div style="font-size:13px;color:#6b7280;margin-bottom:12px">Tu as saisi <strong style="color:#111">"${esc(posteSaisi)}"</strong>. Un poste similaire existe déjà :</div>
        <div style="background:#f0f9ff;border:1px solid #bae6fd;border-radius:8px;padding:12px 14px"><div style="font-weight:600;color:#0369a1;font-size:13px">${esc(similar[0].titre)}</div>${similar[0].client?`<div style="font-size:11px;color:#6b7280;margin-top:2px">${esc(similar[0].client)}</div>`:''}</div>
        <div style="font-size:12px;color:#374151;margin-top:12px">Est-ce le même poste ?</div>`,
        [{label:'Annuler',style:BTN_GREY,value:'cancel'},{label:'Non — créer "'+esc(posteSaisi.length>25?posteSaisi.slice(0,25)+'…':posteSaisi)+'"',style:BTN_GREY,value:'create'},{label:'✓ Oui — utiliser ce poste',style:BTN_NAVY,value:'used'}]);
    }else{
      action=await popupChoice(`<div style="font-size:15px;font-weight:700;color:#111;margin-bottom:8px">📋 Nouveau poste</div>
        <div style="font-size:13px;color:#6b7280">Le poste <strong style="color:#111">"${esc(posteSaisi)}"</strong> n'existe pas encore dans la liste.<br>Voulez-vous le créer automatiquement ?</div>`,
        [{label:'Annuler',style:BTN_GREY,value:'cancel'},{label:'✓ Créer le poste',style:BTN_GREEN,value:'create'}]);
    }
    if(action==='cancel'||!action)return;
    if(action==='used'){
      document.getElementById('f-pid').value=similar[0].id;
      document.getElementById('f-ps').value=similar[0].titre;
      return saveC(id);
    }
    // création du poste puis réouverture du formulaire avec tout ce qui était saisi
    const state=captureFormState();
    const newP={id:uid(),titre:posteSaisi,client:'',secteur:'',lieux:[],urgence:'',statut:'🟢 Actif',salaire:'',experience:'',nbCandidats:'',competences:'',description:''};
    try{await pushPoste(newP);}
    catch(e){console.error('pushPoste',e);showToast('Création du poste impossible — rien n\'a été perdu, réessaie','warn');return;}
    S.postes.unshift(newP);
    pendingCandidatState=state;
    showToast('Poste "'+posteSaisi+'" créé — clique sur Enregistrer pour finir','ok');
    reopenCandidatFormWithState(newP.id,newP.titre);
    return;
  }

  // ── Enregistrement du profil ──
  const rem=(document.getElementById('f-rem')?.value||'').trim();
  const mobilite=[...document.querySelectorAll('#mob-tags .tg')].map(el=>el.childNodes[0].textContent.trim());
  const sourcer=isAdmin()?(document.getElementById('f-src')?.value||getMe()):getMe();
  const p=gp(posteId);
  const fields={
    nom,trigramme:(document.getElementById('f-tri')?.value||'').trim(),
    posteId,posteTitre:p?p.titre:posteSaisi,
    dispo:(document.getElementById('f-dis')?.value||'').trim(),mobilite,
    pretention:(document.getElementById('f-pret')?.value||'').trim(),
    freelance:document.getElementById('f-free')?.value||'Non',
    sourcer,remarque:rem,
    telephone:(document.getElementById('f-tel')?.value||'').trim(),
    tjm:(document.getElementById('f-tjm')?.value||'').trim(),
  };
  const old=id?S.candidates.find(x=>x.id===id):null;
  const cid=old?old.id:uid();
  _saving=true;
  const saveBtn=document.querySelector('.m-actions .btn-p');if(saveBtn){saveBtn.disabled=true;saveBtn.textContent='Enregistrement…';}
  try{
    // 1) CVs : envoi dans la base AVANT d'enregistrer le profil (si ça échoue, rien n'est perdu, le formulaire reste ouvert)
    const cv={o:eCV.o?{url:eCV.o.url,name:eCV.o.name}:null,a:eCV.a?{url:eCV.a.url,name:eCV.a.name}:null};
    for(const t of ['o','a']){
      if(eCVFiles[t]){showToast('Envoi du CV…','ok');cv[t]=await uploadCvFile(cid,t,eCVFiles[t]);}
    }
    const cvFields={cvOUrl:cv.o?cv.o.url:null,cvOName:cv.o?cv.o.name:null,cvAUrl:cv.a?cv.a.url:null,cvAName:cv.a?cv.a.name:null};
    const pend=window._pendingScore||null;
    let saved;
    if(old){
      const upd={
        nom:fields.nom,trigramme:fields.trigramme,poste_titre:fields.posteTitre,dispo:fields.dispo,
        mobilite:JSON.stringify(mobilite),pretention:fields.pretention,freelance:fields.freelance,
        remarque:fields.remarque,sourcer,telephone:fields.telephone,tjm:fields.tjm,
        cv_original_url:cvFields.cvOUrl,cv_original_name:cvFields.cvOName,
        cv_anonyme_url:cvFields.cvAUrl,cv_anonyme_name:cvFields.cvAName,
      };
      if(pendingAnalyse)upd.analyse_cv=pendingAnalyse;
      if(pend&&pend.score){upd.score=pend.score;upd.verdict=pend.verdict||null;}
      let newStatut=old.statut,newOrdre=old.ordre;
      if(sourcer!==old.sourcer){newStatut=(S.statuts[sourcer]||DEFAULT_STATUTS)[0];newOrdre=null;upd.statut=newStatut;upd.ordre=null;}
      await dbUpd(cid,upd);
      const oldUrls=[old.cvOUrl,old.cvAUrl].filter(u=>u&&u!==cvFields.cvOUrl&&u!==cvFields.cvAUrl);
      Object.assign(old,fields,cvFields,{statut:newStatut,ordre:newOrdre});
      if(pendingAnalyse)old.analyse=pendingAnalyse;
      if(pend&&pend.score){old.score=pend.score;old.verdict=pend.verdict||null;}
      if(oldUrls.length)removeCvFiles(oldUrls);
      saved=old;
    }else{
      const sts=S.statuts[sourcer]||[...DEFAULT_STATUTS];
      saved={id:cid,statut:sts[0],ordre:null,score:pend&&pend.score?pend.score:null,verdict:pend&&pend.score?(pend.verdict||null):null,analyse:pendingAnalyse||null,createdAt:new Date().toISOString(),deletedAt:null,...fields,...cvFields};
      const row=candToRow(saved);
      const{error}=await sb.from('candidats').insert(row);
      if(error)throw error;
      S.candidates.push(saved);
    }
    resolvePostes();
    if(rem&&!S.remHist.includes(rem))S.remHist.unshift(rem);
    if(S.remHist.length>20)S.remHist=S.remHist.slice(0,20);
    saveLocal();clearDraft();
    pendingAnalyse=null;window._pendingScore=null;eCVFiles={o:null,a:null};
    _saving=false;
    closeM();
    showToast(old?'Profil mis à jour':'Profil enregistré','ok');
  }catch(e){
    _saving=false;
    console.error('saveC',e);
    if(saveBtn){saveBtn.disabled=false;saveBtn.textContent='Enregistrer';}
    showToast('Enregistrement impossible ('+(e&&e.message?e.message:'erreur')+') — ton formulaire est conservé, réessaie','warn');
  }
}

async function saveP(id){
  const titre=(document.getElementById('p-tit')?.value||'').trim();
  if(!titre){alert('Le titre est obligatoire.');return;}
  const conf=document.getElementById('p-dup-ok');const warn=document.getElementById('dup-p')?.innerHTML||'';
  if(warn&&conf&&!conf.checked){alert("Veuillez confirmer que ce poste n'existe pas déjà.");return;}
  const lieux=[...document.querySelectorAll('#p-lieu-tags .tg')].map(el=>el.childNodes[0].textContent.trim());
  const data={titre,client:(document.getElementById('p-cli')?.value||'').trim(),secteur:(document.getElementById('p-sec')?.value||'').trim(),lieux,urgence:document.getElementById('p-urg')?.value||'',statut:document.getElementById('p-sta')?.value||'🟢 Actif',salaire:(document.getElementById('p-sal')?.value||'').trim(),experience:(document.getElementById('p-exp')?.value||'').trim(),nbCandidats:(document.getElementById('p-nb')?.value||'').trim(),competences:(document.getElementById('p-comp')?.value||'').trim(),description:(document.getElementById('p-desc')?.value||'').trim()};
  const old=isUUID(id)?S.postes.find(x=>x.id===id):null;
  const target=old?{...old,...data}:{id:uid(),...data};
  try{
    await pushPoste(target);
    let renamed=false;
    if(old){
      const oldTitre=old.titre;
      Object.assign(old,data);
      if(oldTitre!==titre){
        // les profils liés suivent le nouveau titre
        const{error}=await sb.from('candidats').update({poste_titre:titre}).eq('poste_titre',oldTitre);
        if(error)throw error;
        S.candidates.concat(S.trash).forEach(c=>{if(c.posteTitre===oldTitre)c.posteTitre=titre;});
        renamed=true;
      }
    }else{S.postes.unshift(target);}
    resolvePostes();
    const hasPending=!!pendingCandidatState;
    showToast('Poste sauvegardé'+(renamed?' — profils liés mis à jour':''),'ok');
    if(hasPending){reopenCandidatFormWithState(target.id,target.titre);}
    else closeM();
  }catch(e){
    console.error(e);showToast('Poste NON enregistré ('+(e&&e.message?e.message:'erreur')+') — réessaie, le formulaire est conservé','warn');
  }
}

async function doDeletePoste(id){
  const p=S.postes.find(x=>x.id===id);if(!p)return;
  const n=S.candidates.filter(c=>c.posteId===id).length;
  if(n>0&&!confirm(n+' profil(s) sont liés à ce poste. Supprimer quand même ? (les profils sont conservés)'))return;
  if(n===0&&!confirm('Supprimer le poste "'+p.titre+'" ?'))return;
  try{await deletePosteDB(id);showToast('Poste supprimé','ok');}
  catch(e){console.error(e);showToast('Suppression impossible — le poste est conservé','warn');}
  render();
}

function normalizeCol(list){ // attribue 0..n-1 ; renvoie les cartes dont l'ordre a changé
  const changed=[];
  list.forEach((x,i)=>{if(x.ordre!==i){x.ordre=i;changed.push(x);}});
  return changed;
}
async function persistOrder(list){
  await Promise.all(list.map(x=>dbUpd(x.id,{ordre:x.ordre})));
}
async function moveCard(id,dir){
  const c=S.candidates.find(x=>x.id===id);if(!c||!canEditC(c.sourcer))return;
  const col=colCards(c.sourcer,colIdxOf(c));
  const i=col.findIndex(x=>x.id===id);
  const j=dir==='up'?i-1:i+1;
  if(j<0||j>=col.length)return;
  const changed=normalizeCol(col);
  const tmp=col[i].ordre;col[i].ordre=col[j].ordre;col[j].ordre=tmp;
  [col[i],col[j]].forEach(x=>{if(!changed.includes(x))changed.push(x);});
  render();
  try{await persistOrder(changed);}catch(e){fail(e,'Déplacement non enregistré');}
}

function dst(e,id){S.dragId=id;e.dataTransfer.effectAllowed='move';setTimeout(()=>document.querySelector(`[data-id="${id}"]`)?.classList.add('dragging'),0);}
function den(){document.querySelectorAll('.card.dragging').forEach(el=>el.classList.remove('dragging'));}
function colDStart(e,idx){S.colDragIdx=idx;e.dataTransfer.effectAllowed='move';setTimeout(()=>document.querySelectorAll('.col')[idx]?.classList.add('col-dragging'),0);}
function colDEnd(){S.colDragIdx=null;document.querySelectorAll('.col').forEach(el=>el.classList.remove('col-dragging','col-drag-over'));render();}
function onColOver(e,idx){
  e.preventDefault();
  if(S.colDragIdx!==null&&S.colDragIdx!==idx){
    document.querySelectorAll('.col').forEach((el,i)=>el.classList.toggle('col-drag-over',i===idx));
  }
}
async function onColDrop(e,colEnc,toIdx){
  e.preventDefault();
  document.querySelectorAll('.col').forEach(el=>el.classList.remove('col-drag-over','col-dragging'));
  if(S.colDragIdx!==null&&S.colDragIdx!==toIdx){
    // réorganisation des colonnes
    if(!canManageCols()){S.colDragIdx=null;return;}
    const arr=S.statuts[S.srcr];
    const[moved]=arr.splice(S.colDragIdx,1);
    arr.splice(toIdx,0,moved);
    S.colDragIdx=null;render();
    try{await saveKanban(S.srcr);}catch(err){fail(err,'Ordre des colonnes non enregistré');}
  }else if(S.dragId){
    const colName=decodeURIComponent(colEnc);
    const c=S.candidates.find(x=>x.id===S.dragId);
    S.dragId=null;
    if(!c||!canEditC(c.sourcer)||c.sourcer!==S.srcr)return;
    if(colIdxOf(c)===toIdx&&c.statut===colName)return;
    // en fin de colonne
    const dest=colCards(c.sourcer,toIdx).filter(x=>x.id!==c.id);
    const changed=normalizeCol(dest);
    c.statut=colName;c.ordre=dest.length;
    render();
    try{
      await dbUpd(c.id,{statut:c.statut,ordre:c.ordre});
      if(changed.length)await persistOrder(changed);
    }catch(err){fail(err,'Déplacement non enregistré');}
  }
}

function setSrc(s){S.srcr=s;render();}
async function addStatutTo(s,name){
  name=(name||'').trim();if(!name)return;
  if(!S.statuts[s])S.statuts[s]=[];
  if(S.statuts[s].includes(name)){showToast('Ce statut existe déjà','warn');return;}
  S.statuts[s].push(name);render();
  try{await saveKanban(s);}catch(e){fail(e,'Statut non enregistré');}
}
function addCol(s){const n=prompt('Nom du nouveau statut :');if(n)addStatutTo(s,n);}
function addSt(s){const inp=document.getElementById('new-st');const v=inp?.value||'';if(inp)inp.value='';addStatutTo(s,v);}
async function renCol(s,idx,val){
  const old=S.statuts[s][idx];val=(val||'').trim();
  if(!val){render();return;}
  if(val===old)return;
  if(S.statuts[s].includes(val)){showToast('Ce statut existe déjà','warn');render();return;}
  S.statuts[s][idx]=val;
  S.candidates.concat(S.trash).forEach(c=>{if(c.sourcer===s&&c.statut===old)c.statut=val;});
  render();
  try{
    const{error}=await sb.from('candidats').update({statut:val}).eq('sourcer',s).eq('statut',old);
    if(error)throw error;
    await saveKanban(s);
  }catch(e){fail(e,'Renommage non enregistré');}
}
async function delCol(s,idx){
  const sts=S.statuts[s];
  if(sts.length<=1){alert('Il faut au moins un statut.');return;}
  const st=sts[idx];
  const dest=sts[idx===0?1:0];
  const n=S.candidates.filter(c=>c.sourcer===s&&c.statut===st).length;
  if(!confirm(n>0?`${n} profil(s) dans « ${st} » seront déplacés dans « ${dest} ». Supprimer la colonne ?`:`Supprimer la colonne « ${st} » ?`))return;
  sts.splice(idx,1);
  S.candidates.concat(S.trash).forEach(c=>{if(c.sourcer===s&&c.statut===st){c.statut=dest;c.ordre=null;}});
  render();
  try{
    const{error}=await sb.from('candidats').update({statut:dest,ordre:null}).eq('sourcer',s).eq('statut',st);
    if(error)throw error;
    await saveKanban(s);
  }catch(e){fail(e,'Suppression de colonne non enregistrée');}
}
async function mvSt(s,idx,dir){
  const arr=S.statuts[s];const ni=idx+dir;if(ni<0||ni>=arr.length)return;
  [arr[idx],arr[ni]]=[arr[ni],arr[idx]];render();
  try{await saveKanban(s);}catch(e){fail(e,'Ordre non enregistré');}
}
async function addSrc(){
  const val=(document.getElementById('new-src')?.value||'').trim();
  if(!val||S.sourceurs.includes(val)||/['"<>\\]/.test(val)){alert('Nom invalide ou déjà existant (pas de guillemets ni apostrophes).');return;}
  S.sourceurs.push(val);S.statuts[val]=[...DEFAULT_STATUTS];render();
  try{await saveKanban(val);}catch(e){fail(e,'Sourceur non enregistré');}
}
async function delSrc(s){
  const n=S.candidates.concat(S.trash).filter(c=>c.sourcer===s).length;
  if(n>0){alert(`${s} a encore ${n} profil(s) (corbeille comprise). Déplace-les ou supprime-les définitivement avant de retirer ce sourceur.`);return;}
  if(!confirm('Retirer le sourceur '+s+' ?'))return;
  try{
    const{error}=await sb.from('kanban_config').delete().eq('sourcer',s);
    if(error)throw error;
    S.sourceurs=S.sourceurs.filter(x=>x!==s);delete S.statuts[s];S.kanbanKnown.delete(s);
    if(S.srcr===s)S.srcr=S.sourceurs[0];
    render();
  }catch(e){fail(e,'Suppression impossible');}
}

async function hardDelCand(id){

}

// ── Normalize helpers ──
function mapFreelance(val){
  if(!val||val==='nan'||val.trim()==='')return'Non';
  const v=val.trim().toLowerCase();
  if(v==='oui'||v==='yes'||v==='true')return'Oui';
  if(v==='non'||v==='no'||v==='false')return'Non';
  if(v.startsWith('cdi')&&v.length<6)return'CDI';
  if(v.includes('cdi')&&v.length<20)return'CDI';
  return'À valider';
}

function mapStatut(raw,sourcer){
  if(!raw)return null;
  const s=raw.trim();
  const map={
    '📦 Archiver':'📦 Archiver','📦Archiver':'📦 Archiver',
    '✅ Envoyer':'✅ À envoyer','✅Envoyer':'✅ À envoyer','✅ À envoyer':'✅ À envoyer',
    '📤 À appeler':'📤 À appeler','📤 A appeler':'📤 À appeler','📤A appeler':'📤 À appeler',
    '⏳ En attente':'⏳ En attente',
    '🆕 Nouveau':'🆕 Nouveau',
  };
  if(map[s])return map[s];
  // Statuts perso Notion (Profils de X) → premier statut du sourceur
  return(S.statuts[sourcer]||[...DEFAULT_STATUTS])[0];
}

function parseRow(row,sourcer){
  const nom=(row['Nom et prénom']||row['nom']||'').trim();
  if(!nom)return null;
  const pr=(row['Poste ciblé']||row['poste']||'').replace(/\s{0,5}\(https?:\/\/[^)]+\)/g,'').trim();
  const found=S.postes.find(p=>sim(p.titre,pr)>0.55);
  const mobilite=[];
  const mob=(row['Mobilité']||'').trim();
  const lieu=(row['Lieu']||'').trim();
  if(mob)mobilite.push(mob);else if(lieu)mobilite.push(lieu);
  const srcRaw=(row['Sourcer']||'').trim();
  const srcMap={'Ormani':'Mehdi','Tafinar':'Mehdi','said.aabadi':'Said'};
  const src=srcMap[srcRaw]||(S.sourceurs.includes(srcRaw)?srcRaw:sourcer);
  const statut=mapStatut(row['Statut interne']||'',src)||(S.statuts[src]||[...DEFAULT_STATUTS])[0];
  return{
    id:uid(),nom,
    trigramme:(row['Trigramme']||'').trim(),
    posteId:found?found.id:'',posteTitre:pr,
    dispo:(row['Disponibilité']||'').trim(),
    mobilite,
    pretention:(row['Prétention salariale']||'').trim(),
    freelance:mapFreelance(row['Freelance']||''),
    remarque:(row['Remarque profil']||'').trim(),
    sourcer:src,statut,
    score:null,verdict:null,ordre:null,deletedAt:null,
  };
}
// Global pending import state
let _importPending = null;

function impCSV(e){
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=ev=>{
    const rows=parseCSV(ev.target.result);
    if(rows.length<2){showToast('Fichier CSV vide ou invalide','warn');return;}
    const headers=rows[0].map(h=>h.trim());
    const dataRows=rows.slice(1).map(vals=>{
      const obj={};headers.forEach((h,j)=>obj[h]=(vals[j]||'').trim());return obj;
    }).filter(row=>(row['Nom et prénom']||row['nom']||'').trim());
    const nouveaux=[];const doublons=[];
    dataRows.forEach(row=>{
      const parsed=parseRow(row,getMe()||S.srcr);
      if(!parsed)return;
      const existing=S.candidates.find(c=>sim(c.nom,parsed.nom)>0.88);
      if(existing)doublons.push({parsed,existing});
      else nouveaux.push(parsed);
    });
    _importPending={nouveaux,doublons};
    showImportModal();
  };
  r.readAsText(file,'UTF-8');
}

async function confirmImport(){
  if(!_importPending){closeM();return;}
  const{nouveaux,doublons}=_importPending;
  const dupMode=document.getElementById('dup-mode')?.value||'skip';
  const readRow=(tr)=>{
    const inputs=[...tr.querySelectorAll('input:not([type="checkbox"])')];
    return{
      nom:(inputs[0]?.value||'').trim(),trigramme:(inputs[1]?.value||'').trim(),
      posteTitre:(inputs[2]?.value||'').trim(),dispo:(inputs[3]?.value||'').trim(),
      pretention:(inputs[4]?.value||'').trim(),sourcer:(inputs[5]?.value||'').trim(),
    };
  };
  const fix=c=>{
    const found=S.postes.find(p=>sim(p.titre,c.posteTitre)>0.55);
    c.posteId=found?found.id:'';
    if(found)c.posteTitre=found.titre;
    if(!S.sourceurs.includes(c.sourcer)||!canEditC(c.sourcer))c.sourcer=getMe()||S.sourceurs[0];
    const sts=S.statuts[c.sourcer]||DEFAULT_STATUTS;
    if(!sts.includes(c.statut))c.statut=sts[0];
    c.ordre=null;c.deletedAt=null;
    return c;
  };
  const toInsert=[],toReplace=[];
  let newIdx=0,dupIdx=0;
  [...document.querySelectorAll('#import-tbody tr')].forEach(tr=>{
    const cb=tr.querySelector('input[data-type="new"],input[data-type="dup"]');if(!cb)return;
    const edited=readRow(tr);
    if(cb.dataset.type==='new'){
      if(cb.checked&&nouveaux[newIdx])toInsert.push(fix({...nouveaux[newIdx],...edited,id:uid()}));
      newIdx++;
    }else{
      const d=doublons[dupIdx];
      if(cb.checked&&d){
        const parsed=fix({...d.parsed,...edited,id:uid()});
        if(dupMode==='add')toInsert.push(parsed);
        else if(dupMode==='replace')toReplace.push({old:d.existing,parsed});
      }
      dupIdx++;
    }
  });
  const btn=document.querySelector('.m-actions .btn-p');if(btn){btn.disabled=true;btn.textContent='Import en cours…';}
  try{
    for(let i=0;i<toInsert.length;i+=100){
      const chunk=toInsert.slice(i,i+100).map(candToRow);
      const{error}=await sb.from('candidats').insert(chunk);
      if(error)throw error;
    }
    for(const r of toReplace){
      const p=r.parsed;
      await dbUpd(r.old.id,{nom:p.nom,trigramme:p.trigramme,poste_titre:p.posteTitre,dispo:p.dispo,mobilite:JSON.stringify(p.mobilite||[]),pretention:p.pretention,freelance:p.freelance,remarque:p.remarque,sourcer:p.sourcer,statut:p.statut,ordre:null});
    }
    _importPending=null;
    await loadAll();
    closeM();
    showToast((toInsert.length+toReplace.length)+' profil(s) importé(s)','ok');
  }catch(e){
    console.error('import',e);
    if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-check" aria-hidden="true"></i> Confirmer l\'import';}
    showToast('Import interrompu ('+(e&&e.message?e.message:'erreur')+') — rien n\'est perdu, relance l\'import (les doublons seront signalés)','warn');
    loadAll();
  }
}

function impCSVPostes(e){
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=async ev=>{
    const rows=parseCSV(ev.target.result);if(rows.length<2){showToast('Fichier CSV vide ou invalide','warn');return;}
    const headers=rows[0].map(h=>h.trim());
    let added=0,errors=0;
    for(const vals of rows.slice(1)){
      const row={};headers.forEach((h,j)=>row[h]=(vals[j]||'').trim());
      const titre=row['Nom complet']||row['titre']||'';if(!titre)continue;
      if(S.postes.some(p=>sim(p.titre,titre)>0.8))continue;
      const np={id:uid(),titre,client:row['🏢 Client']||'',lieux:[row['📍 Lieu']||''].filter(Boolean),secteur:row["🏭 Secteur d'activité"]||'',urgence:row['⚠️ Urgence']||'',statut:'🟢 Actif',salaire:'',experience:'',nbCandidats:'',competences:'',description:''};
      try{await pushPoste(np);S.postes.unshift(np);added++;}catch(err){console.error(err);errors++;}
    }
    e.target.value='';
    render();showToast(`${added} poste(s) importé(s)`+(errors?` — ${errors} erreur(s)`:''),errors?'warn':'ok');
  };r.readAsText(file,'UTF-8');
}

function expCSV(type){

  const blob=new Blob(['\ufeff'+content],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url);

// URL PARAMS (depuis Recrutement TAFINAR)

function handleURLParams(){
  const params=new URLSearchParams(window.location.search);
  const action=params.get('action');
  if(!action)return;
  // Nettoyer l'URL
  window.history.replaceState({},'',window.location.pathname);

  if(action==='new_profil'){
    // Pré-remplir le formulaire candidat
    setTimeout(()=>{
      openForm(null);
      setTimeout(()=>{
        const fn=document.getElementById('f-nom');if(fn)fn.value=decodeURIComponent(params.get('nom')||'');
        const ft=document.getElementById('f-tri');if(ft)ft.value=decodeURIComponent(params.get('trigramme')||'');
        const fd=document.getElementById('f-dis');if(fd)fd.value=decodeURIComponent(params.get('dispo')||'');
        const fp=document.getElementById('f-pret');if(fp)fp.value=decodeURIComponent(params.get('pretention')||'');
        // Score et verdict
        const score=params.get('score');const verdict=params.get('verdict');
        // Recherche du poste
        const posteNom=decodeURIComponent(params.get('poste')||'');
        if(posteNom){
          const fi=document.getElementById('f-ps');if(fi)fi.value=posteNom;
          const match=S.postes.find(p=>sim(p.titre,posteNom)>0.7);
          if(match){const hid=document.getElementById('f-pid');if(hid)hid.value=match.id;}
          else filtPS();
        }
        // Stocker score/verdict pour save
        if(score)window._pendingScore={score:parseInt(score),verdict:verdict||''};
      },100);
    },300);
  }

  if(action==='new_poste'){
    setTimeout(()=>{
      openPosteForm(null);
      setTimeout(()=>{
        const pt=document.getElementById('p-tit');if(pt)pt.value=decodeURIComponent(params.get('titre')||'');
        const pd=document.getElementById('p-desc');if(pd)pd.value=decodeURIComponent(params.get('description')||'');
        const pc=document.getElementById('p-cli');if(pc)pc.value=decodeURIComponent(params.get('client')||'');
        chkDupP();
      },100);
    },300);
  }
}

const SU_STATUTS=[
  {id:'envoye',label:'📤 Envoyé',rank:0,color:'#1e40af',bg:'#dbeafe'},
  {id:'retour',label:'💬 Retour client',rank:1,color:'#92400e',bg:'#fef3c7'},

  {id:'refuse',label:'❌ Refusé',rank:-1,color:'#991b1b',bg:'#fee2e2',closed:true},
  {id:'abandon',label:'🚫 Abandon',rank:-1,color:'#6b7280',bg:'#f3f4f6',closed:true},
];
const RELANCE_JOURS=10;
S.suivi=[];S.suiviOk=true;S.suView='liste';

function suSt(id){return SU_STATUTS.find(s=>s.id===id)||SU_STATUTS[0];}
function pad2(n){return String(n).padStart(2,'0');}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function daysSince(iso){if(!iso)return 0;const[y,m,d]=iso.slice(0,10).split('-').map(Number);return Math.floor((new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate())-new Date(y,m-1,d))/86400000);}
const JOURS_FR=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
function dateFR(iso){ // 2026-09-16 -> Mercredi 16/09/26
  if(!iso)return'';const[y,m,d]=iso.slice(0,10).split('-').map(Number);
  return JOURS_FR[new Date(y,m-1,d).getDay()]+' '+pad2(d)+'/'+pad2(m)+'/'+String(y).slice(2);
}
function dateCourte(iso){if(!iso)return'—';const[y,m,d]=iso.slice(0,10).split('-').map(Number);return pad2(d)+'/'+pad2(m)+'/'+String(y).slice(2);}
function suRelance(r){return r.statut==='envoye'&&daysSince(r.dateEnvoi)>=RELANCE_JOURS;}
function suRetard(r){return r.statut==='planifie'&&r.eDate&&r.eDate<todayISO();}

function rowToSuivi(r){
  return{id:r.local_id,candId:r.cand_id||'',quad:r.profil_quad||'',nom:r.profil_nom||'',client:r.client||'',
    posteTitre:r.poste_titre||'',sourcer:r.sourcer||'',statut:r.statut||'envoye',dateEnvoi:(r.date_envoi||'').slice(0,10),
    eDate:(r.entretien_date||'').slice(0,10),eHeure:r.entretien_heure||'',interlocuteur:r.interlocuteur||'',
    teams:r.teams_link||'',civilite:r.civilite||'Monsieur',notes:r.notes||'',histo:Array.isArray(r.historique)?r.historique:tryJSON(r.historique,[]),
    createdAt:r.created_at||''};
}
function suiviToRow(s){
  return{local_id:s.id,cand_id:s.candId,profil_quad:s.quad,profil_nom:s.nom,client:s.client,poste_titre:s.posteTitre,sourcer:s.sourcer,
    statut:s.statut,date_envoi:s.dateEnvoi||null,entretien_date:s.eDate||null,entretien_heure:s.eHeure||null,interlocuteur:s.interlocuteur||null,
    teams_link:s.teams||null,civilite:s.civilite||'Monsieur',notes:s.notes||null,historique:s.histo||[],updated_at:new Date().toISOString()};

async function dbUpdSuivi(id,fields){

function suivisClients(){

}
function suPush(s,statut,note){(s.histo=s.histo||[]).push({t:new Date().toISOString(),s:statut,n:note||'',by:getMe()});}
function suMaxRank(s){let m=suSt(s.statut).rank;(s.histo||[]).forEach(h=>{const r=suSt(h.s).rank;if(r>m)m=r;});return m;}

async function suCreate(items){ // items: [{cand,posteTitre,client}]
  const rows=[];
  items.forEach(it=>{
    const c=it.cand;
    const s={id:uid(),candId:c.id,quad:c.trigramme||quadDe(c.nom),nom:c.nom,client:(it.client||'').trim(),posteTitre:it.posteTitre||'',
      sourcer:getMe()||c.sourcer,statut:'envoye',dateEnvoi:todayISO(),eDate:'',eHeure:'',interlocuteur:'',teams:'',civilite:'Monsieur',notes:'',histo:[],createdAt:new Date().toISOString()};
    suPush(s,'envoye','Envoyé'+(s.client?' à '+s.client:''));
    rows.push(s);
  });
  const{error}=await sb.from('suivi').insert(rows.map(suiviToRow));

function suFiltered(){
  const f=S.suF;const q=normNom(f.q);
  return S.suivi.filter(s=>{
    const st=suSt(s.statut);
    if(f.statut==='actifs'&&st.closed)return false;
    if(f.statut&&f.statut!=='actifs'&&f.statut!=='tous'&&s.statut!==f.statut)return false;
    if(f.client&&s.client!==f.client)return false;
    if(f.src&&s.sourcer!==f.src)return false;
    if(q&&!normNom([s.quad,s.nom,s.client,s.posteTitre,s.interlocuteur,s.sourcer].join(' ')).includes(q))return false;
    return true;
  }).sort((a,b)=>String(b.dateEnvoi).localeCompare(String(a.dateEnvoi))||String(b.createdAt).localeCompare(String(a.createdAt)));

function suUpcomingHTML(){

function suStatsHTML(){
  const all=S.suivi;
  if(!all.length)return'<div style="padding:30px;text-align:center;color:#9ca3af;font-size:13px">Pas encore de données.</div>';
  const agg=key=>{const m={};all.forEach(s=>{const k=s[key]||'—';const o=m[k]||(m[k]={n:0,ent:0,val:0,ref:0,cours:0});o.n++;const r=suMaxRank(s);if(r>=2)o.ent++;if(s.statut==='valide')o.val++;if(s.statut==='refuse')o.ref++;if(!suSt(s.statut).closed)o.cours++;});return Object.entries(m).sort((a,b)=>b[1].n-a[1].n);};
  const pct=(a,b)=>b?Math.round(a*100/b)+' %':'—';
  const th='padding:6px 10px;text-align:left;font-size:11px;color:#6b7280;border-bottom:1px solid #e5e7eb',td='padding:6px 10px;font-size:12px;border-bottom:1px solid #f3f4f6';

  const tot={n:all.length,ent:all.filter(s=>suMaxRank(s)>=2).length,val:all.filter(s=>s.statut==='valide').length};
  return`<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px">`
    +[['Profils envoyés',tot.n],['Ont eu un entretien',tot.ent+' ('+pct(tot.ent,tot.n)+')'],['Validés',tot.val+' ('+pct(tot.val,tot.n)+')'],['À relancer',all.filter(suRelance).length]].map(([l,v])=>`<div style="background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:12px 18px"><div style="font-size:11px;color:#6b7280">${l}</div><div style="font-size:20px;font-weight:700;color:#0d3b6e">${v}</div></div>`).join('')
    +`</div>`+tbl('Par client','client')+tbl('Par sourceur','sourcer');
}

async function suSetStatut(id,val,silent){
  const s=suGet(id);if(!s||s.statut===val)return;
  const before=s.statut;
  s.statut=val;suPush(s,val,suSt(val).label.replace(/^\S+\s/,''));
  try{await dbUpdSuivi(id,{statut:s.statut,historique:s.histo});}
  catch(e){console.error(e);showToast('Enregistrement impossible — rechargement','warn');await fetchSuivi();}
  if(document.getElementById('su-detail'))suDetailRefreshHisto(id);
  if(!silent)render2();
  if(val==='planifie'&&!s.eDate&&!document.getElementById('su-detail')){showToast('Renseigne la date de l\'entretien','ok');openSuivi(id);}
}
function render2(){if(S.tab==='su'&&!document.getElementById('su-detail')){const y=window.scrollY;render();window.scrollTo(0,y);}else if(S.tab==='su')suBody();}
async function suField(id,key,val){
  const s=suGet(id);if(!s)return;
  val=(val||'').trim();
  if(s[key]===val)return;
  s[key]=val;
  const fields={[SU_COL[key]]:(val===''&&['dateEnvoi','eDate','eHeure','teams','interlocuteur','notes'].includes(key))?null:val};
  // une date + heure d'entretien fait passer automatiquement en « planifié »
  if((key==='eDate'||key==='eHeure')&&s.eDate&&s.eHeure&&suSt(s.statut).rank<2&&!suSt(s.statut).closed){
    s.statut='planifie';suPush(s,'planifie','Entretien planifié le '+dateCourte(s.eDate)+' '+s.eHeure);
    fields.statut='planifie';fields.historique=s.histo;
    const sel=document.getElementById('su-f-statut');if(sel)sel.value='planifie';
    suDetailRefreshHisto(id);
  }
  try{await dbUpdSuivi(id,fields);}
  catch(e){console.error(e);showToast('Enregistrement impossible — rechargement','warn');await fetchSuivi();}
  if(S.tab==='su')suBody();
}
async function suDelete(id){
  const s=suGet(id);if(!s)return;
  if(!confirm('Supprimer ce suivi ('+s.quad+' — '+(s.client||'?')+') ? Le profil lui-même n\'est pas touché.'))return;
  const{error}=await sb.from('suivi').delete().eq('local_id',id);
  if(error){showToast('Suppression impossible','warn');return;}
  S.suivi=S.suivi.filter(x=>x.id!==id);closeM();showToast('Suivi supprimé');
}

function nsFilter(){
  const q=normNom(document.getElementById('ns-q').value);const L=document.getElementById('ns-list');
  if(q.length<2){L.style.display='none';return;}
  const r=S.candidates.filter(c=>normNom(c.nom+' '+(c.trigramme||'')).includes(q)).slice(0,12);
  L.style.display=r.length?'block':'none';
  L.innerHTML=r.map(c=>`<div style="padding:6px 10px;font-size:12px;cursor:pointer;border-bottom:1px solid #f3f4f6" onclick="nsPick('${c.id}')"><strong>${esc(c.trigramme||quadDe(c.nom))}</strong> — ${esc(c.nom)} <span style="color:#9ca3af">${esc(c.sourcer||'')}</span></div>`).join('');

function nsPick(id){
  const c=S.candidates.find(x=>x.id===id);if(!c)return;
  document.getElementById('ns-cid').value=id;document.getElementById('ns-list').style.display='none';
  document.getElementById('ns-q').value=c.nom;document.getElementById('ns-pick').textContent='✓ '+c.nom;

function nsPoste(){

async function nsSave(){

const SEP='-----------------------------------------------------';
let SM=null; // état du mail en cours

function suNeedDate(s){
  if(!s.eDate||!s.eHeure){showToast("Renseigne d'abord la date et l'heure de l'entretien",'warn');openSuivi(s.id);return false;}
  return true;
}
function suSubject(s){
  return ['Entretien',s.client,'Profil '+s.quad,dateFR(s.eDate)+' '+s.eHeure,s.posteTitre].filter(Boolean).join(' - ');
}
function suClientBody(s,c){
  const L=['Bonjour,','',SEP,''];
  L.push('Profil '+s.quad+(s.posteTitre?' — '+s.posteTitre:''));
  if(c){
    const add=(l,v)=>{if(v&&String(v).trim())L.push(l+' : '+String(v).trim());};
    add('Disponibilité',c.dispo);add('Mobilité',(c.mobilite||[]).join(', '));add('Prétention',c.pretention);add('TJM (€ HT)',c.tjm);add('Freelance',c.freelance);add('Remarques',c.remarque);
  }
  L.push('CV : voir pièce(s) jointe(s)');
  L.push('',SEP,'');
  L.push('Pourriez-vous nous communiquer les informations Teams (lien de connexion) pour l\'entretien du '+dateFR(s.eDate)+' à '+s.eHeure+(s.interlocuteur?' avec '+s.interlocuteur:'')+' ?');
  L.push('',SEP,'');
  L.push('Pourriez-vous également nous transmettre la fiche de poste ?');
  return L.join('\n');
}
function suTextToHtml(t){
  const FF='font-family:Arial,sans-serif;font-size:13px;color:#1a1a1a;';
  const out=t.split('\n').map(l=>/^-{10,}$/.test(l.trim())
    ?'<hr style="border:none;border-top:1px solid #9ca3af;margin:6px 0">'
    :'<p style="margin:0;'+FF+'">'+(l.trim()===''?'&nbsp;':'<font color="#1a1a1a" face="Arial">'+esc(l).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1">$1</a>')+'</font>')+'</p>').join('');
  return '<div style="'+FF+'">'+out+'</div>';
}
function openMailClient(id){
  const s=suGet(id);if(!s||!suNeedDate(s))return;
  const c=suCand(s);
  SM={kind:'client',id,subject:suSubject(s),body:suClientBody(s,c)};
  const cvs=[];
  if(c&&c.cvOUrl)cvs.push({k:'o',label:'CV original',url:c.cvOUrl,name:c.cvOName||'CV_original.pdf'});
  if(c&&c.cvAUrl)cvs.push({k:'a',label:'CV anonymisé',url:c.cvAUrl,name:c.cvAName||'CV_anonyme.pdf'});
  SM.cvs=cvs;
  suMailModal(`<div style="font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px">CV à joindre</div>
    <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:6px">${cvs.length?cvs.map((v,i)=>`<label style="font-size:12px"><input type="checkbox" class="sm-cv" data-i="${i}" checked> ${v.label} <span style="color:#9ca3af">(${esc(v.name)})</span></label>`).join(''):'<span style="font-size:12px;color:#c2410c">Aucun CV enregistré pour ce profil — ajoute-le dans « Les Profils ».</span>'}</div>
    <div style="font-size:11px;color:#b45309;margin-bottom:10px">Le CV original contient le nom et les coordonnées du candidat.</div>`,'Mail client — entretien');
}
function openMailCand(id){

// ── .eml : brouillon Outlook avec pièces jointes ──
function b64utf8(str){const b=new TextEncoder().encode(str);let s='';b.forEach(x=>s+=String.fromCharCode(x));return btoa(s);}
function wrap76(b64){return(b64.match(/.{1,76}/g)||[]).join('\r\n');}
function encWord(str){ // RFC 2047, découpé pour rester < 75 caractères par mot encodé
  if(/^[\x20-\x7e]*$/.test(str))return str;
  const parts=[];let cur='';
  for(const ch of str){
    if(new TextEncoder().encode(cur+ch).length>42){parts.push(cur);cur='';}
    cur+=ch;
  }
  if(cur)parts.push(cur);
  return parts.map(p=>'=?UTF-8?B?'+b64utf8(p)+'?=').join('\r\n ');
}
async function urlToB64(url){
  const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);
  const buf=new Uint8Array(await r.arrayBuffer());let s='';
  for(let i=0;i<buf.length;i+=0x8000)s+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000));
  return{b64:btoa(s),type:r.headers.get('content-type')||'application/pdf'};
}
function buildEml(subject,html,atts){
  const bd='----=_TAFINAR_'+Date.now().toString(36);
  let m='X-Unsent: 1\r\nSubject: '+encWord(subject)+'\r\nMIME-Version: 1.0\r\nContent-Type: multipart/mixed; boundary="'+bd+'"\r\n\r\n';
  m+='--'+bd+'\r\nContent-Type: text/html; charset="utf-8"\r\nContent-Transfer-Encoding: base64\r\n\r\n'+wrap76(b64utf8('<html><body>'+html+'</body></html>'))+'\r\n';
  atts.forEach(a=>{
    const fn=encWord(a.name);
    m+='--'+bd+'\r\nContent-Type: '+a.type+'; name="'+fn+'"\r\nContent-Transfer-Encoding: base64\r\nContent-Disposition: attachment; filename="'+fn+'"\r\n\r\n'+wrap76(a.b64)+'\r\n';
  });
  return m+'--'+bd+'--\r\n';
}
function downloadBlob(data,type,name){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
async function suEml(btn){
  const s=suGet(SM.id);const old=btn.innerHTML;btn.disabled=true;btn.textContent='Préparation…';
  const atts=[];const miss=[];

    for(const v of suSelectedCvs()){
      try{const r=await urlToB64(v.url);atts.push({name:v.name,type:r.type,b64:r.b64});}catch(e){console.warn(e);miss.push(v.label);}
    }
  }
  const eml=buildEml(document.getElementById('sm-subject').value,suTextToHtml(document.getElementById('sm-body').value),atts);
  downloadBlob(eml,'message/rfc822','Entretien_'+(s?s.quad:'')+'_'+(s?s.eDate:'')+'.eml');
  btn.disabled=false;btn.innerHTML=old;
  showToast(miss.length?'Brouillon créé SANS : '+miss.join(', ')+' (téléchargement impossible)':'Brouillon téléchargé — double-clique dessus pour l\'ouvrir dans Outlook',miss.length?'warn':'ok');
}

// ── .ics ──
function icsEsc(t){return String(t||'').replace(/\\/g,'\\\\').replace(/;/g,'\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');}
function suIcs(s){
  const d=s.eDate.replace(/-/g,'');const[h,m]=(s.eHeure||'09:00').split(':').map(Number);
  const st=d+'T'+pad2(h)+pad2(m||0)+'00';
  const e=new Date(2000,0,1,h+1,m||0);const en=d+'T'+pad2(e.getHours())+pad2(e.getMinutes())+'00';
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//TAFINAR//Suivi//FR','CALSCALE:GREGORIAN','METHOD:PUBLISH','BEGIN:VEVENT',
    'UID:'+s.id+'@tafinar','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z','DTSTART:'+st,'DTEND:'+en,
    'SUMMARY:'+icsEsc('Entretien '+(s.client?s.client+' - ':'')+'Profil '+s.quad),
    'DESCRIPTION:'+icsEsc([s.posteTitre,s.interlocuteur?'Avec '+s.interlocuteur:'',s.teams?'Teams : '+s.teams:''].filter(Boolean).join('\n')),
    'LOCATION:'+icsEsc(s.teams?'Microsoft Teams':''),s.teams?'URL:'+s.teams:null,'END:VEVENT','END:VCALENDAR'].filter(x=>x!==null);
  return L.join('\r\n')+'\r\n';
}
function suIcsDownload(id){
  const s=suGet(id);if(!s)return;
  if(!s.eDate||!s.eHeure){showToast("Renseigne d'abord la date et l'heure",'warn');return;}
  downloadBlob(suIcs(s),'text/calendar','Entretien_'+s.quad+'_'+s.eDate+'.ics');
}

function scanLocal(){
  const out={cands:[],trash:[],statuts:null};
  try{
    const seen=new Set();
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&k.startsWith('tn_cands_')){
        const arr=tryJSON(localStorage.getItem(k),[]);
        if(Array.isArray(arr))arr.forEach(c=>{if(c&&c.id&&c.nom&&!c._fromSB&&!seen.has(c.id)){seen.add(c.id);out.cands.push(c);}});
      }
    }
    const tr=tryJSON(localStorage.getItem('tn_trash'),[]);
    if(Array.isArray(tr))tr.forEach(c=>{if(c&&c.id&&c.nom&&!c._fromSB&&!seen.has(c.id)){seen.add(c.id);out.trash.push(c);}});
    out.statuts=tryJSON(localStorage.getItem('tn_statuts'),null);
  }catch(e){console.warn('scanLocal',e);}
  return out;
}
