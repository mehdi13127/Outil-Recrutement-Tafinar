<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAFINAR v79 — Espace de travail</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#eef0f3;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ── Topbar ── */
.topbar{
  display:flex;align-items:center;gap:8px;
  padding:8px 16px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  flex-shrink:0;
  z-index:100;
}
.logo{font-size:16px;font-weight:700;color:#0d3b6e;letter-spacing:-.3px;margin-right:8px}

.nav-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 14px;
  border-radius:8px;
  font-size:13px;font-weight:500;
  cursor:pointer;
  border:1.5px solid transparent;
  font-family:inherit;
  transition:all .15s;
}
/* Recrutement — bleu */
.nav-rec{
  background:#e6f0ff;color:#0d3b6e;border-color:#c7d9f5;
}
.nav-rec:hover{background:#d0e4ff}
.nav-rec.active{background:#0d3b6e;color:#fff;border-color:#0d3b6e}

/* Notion — vert */
.nav-not{
  background:#dcfce7;color:#0e7c3a;border-color:#bbf7d0;
}
.nav-not:hover{background:#c6f5d5}
.nav-not.active{background:#0e7c3a;color:#fff;border-color:#0e7c3a}

/* Newsletter — orange */
.nav-news{background:#fff1e0;color:#9a4a00;border-color:#fed7aa}
.nav-news:hover{background:#ffe4c4}
.nav-news.active{background:#c2570c;color:#fff;border-color:#c2570c}
.spacer{flex:1}

/* ── Iframes ── */
.frames{flex:1;position:relative;overflow:hidden}
iframe{
  position:absolute;top:0;left:0;width:100%;height:100%;
  border:none;
  background:#eef0f3;
  transition:opacity .15s;
}
iframe.hidden{
  opacity:0;
  pointer-events:none;
  z-index:0;
}
iframe.visible{
  opacity:1;
  pointer-events:auto;
  z-index:1;
}
</style>
</head>
<body>

<div class="topbar">
  <span class="logo">TAFINAR</span>

  <button class="nav-btn nav-not" id="btn-notion" onclick="switchTo('notion')">
    <i class="ti ti-layout-kanban" aria-hidden="true"></i>
    Notion TAFINAR
  </button>

  <button class="nav-btn nav-rec active" id="btn-rec" onclick="switchTo('rec')">
    <i class="ti ti-file-search" aria-hidden="true"></i>
    Recrutement TAFINAR
  </button>

  <button class="nav-btn nav-news" id="btn-news" onclick="switchTo('news')">
    <i class="ti ti-mail-forward" aria-hidden="true"></i>
    Newsletter
  </button>
</div>

<div class="frames">
  <iframe id="frame-rec" class="visible" src="recrutement.html" title="Recrutement TAFINAR"></iframe>
  <iframe id="frame-notion" class="hidden" src="notion.html" title="Notion TAFINAR"></iframe>
  <iframe id="frame-news" class="hidden" src="newsletter.html" title="Newsletter TAFINAR"></iframe>
</div>

<script>
let current = 'rec';

function switchTo(app) {
  switchToWithData(app, null);
}

function switchToWithData(app, payload) {
  const frames = {rec:'frame-rec', notion:'frame-notion', news:'frame-news'};
  const btns   = {rec:'btn-rec',   notion:'btn-notion',   news:'btn-news'};
  current = app;
  Object.keys(frames).forEach(function(k){
    const f = document.getElementById(frames[k]);
    const b = document.getElementById(btns[k]);
    if (k === app) { f.classList.remove('hidden'); f.classList.add('visible'); b.classList.add('active'); }
    else           { f.classList.remove('visible'); f.classList.add('hidden'); b.classList.remove('active'); }
  });
  if (app === 'notion' && payload) {
    const fn = document.getElementById('frame-notion');
    if (payload.type === 'tn_poste') {
      fn.contentWindow.postMessage({type:'tn_poste', payload:payload}, '*');
    } else {
      fn.contentWindow.postMessage({type:'tn_prefill', payload:payload}, '*');
    }
  }
  if (app === 'news') {
    try { document.getElementById('frame-news').contentWindow.postMessage({type:'tn_news_show'}, '*'); } catch(e) {}
  }
}
</script>
</body>
</html>
